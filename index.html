/* ==========================================================
   子页面：专业课程 TeachingCourses
   ========================================================== */

function TeachingCourses({ courses, teachingClasses, archives, allTeachers }) {
  const [typeFilter, setTypeFilter] = React.useState('all');

  const courseTypes = React.useMemo(() => {
    const types = new Set();
    courses.forEach(c => {
      const t = c.fields['课程类型'] || c.fields['类型'] || '未分类';
      types.add(t);
    });
    return Array.from(types);
  }, [courses]);

  const filteredCourses = React.useMemo(() => {
    if (typeFilter === 'all') return courses;
    return courses.filter(c =>
      (c.fields['课程类型'] || c.fields['类型'] || '未分类') === typeFilter
    );
  }, [courses, typeFilter]);

  // 每门课的授课教师（从教学班关联）
  const getCourseTeachers = (courseId) => {
    const relatedClasses = teachingClasses.filter(c => {
      const cid = c.fields['课程'];
      return Array.isArray(cid) ? cid.includes(courseId) : cid === courseId;
    });
    const teacherIds = new Set();
    relatedClasses.forEach(c => {
      const tids = c.fields['授课教师'];
      if (Array.isArray(tids)) tids.forEach(id => teacherIds.add(id));
      else if (tids) teacherIds.add(tids);
    });
    return allTeachers.filter(t => teacherIds.has(t.record_id));
  };

  // 每门课的大纲完成度（从课程档案统计）
  const getCourseProgress = (courseId) => {
    const courseArchives = archives.filter(a => {
      const cid = a.fields['课程'];
      return Array.isArray(cid) ? cid.includes(courseId) : cid === courseId;
    });
    if (courseArchives.length === 0) return 0;
    const done = courseArchives.filter(a => a.fields['大纲状态'] === '已完成').length;
    return Math.round((done / courseArchives.length) * 100);
  };

  return (
    <div className="teaching-courses">
      <div className="teaching-toolbar">
        <div className="teaching-filter-group">
          <button
            className={'teaching-filter-btn' + (typeFilter === 'all' ? ' active' : '')}
            onClick={() => setTypeFilter('all')}
          >
            全部类型
          </button>
          {courseTypes.map(t => (
            <button
              key={t}
              className={'teaching-filter-btn' + (typeFilter === t ? ' active' : '')}
              onClick={() => setTypeFilter(t)}
            >
              {t}
            </button>
          ))}
        </div>
        <div className="teaching-toolbar-right">
          <span className="teaching-count">共 {filteredCourses.length} 门课程</span>
        </div>
      </div>

      {filteredCourses.length === 0 ? (
        <div className="teaching-empty-card">
          <div className="teaching-empty-icon">📚</div>
          <div className="teaching-empty-text">暂无课程数据</div>
        </div>
      ) : (
        <div className="teaching-course-grid">
          {filteredCourses.map(course => {
            const f = course.fields;
            const courseTeachers = getCourseTeachers(course.record_id);
            const progress = getCourseProgress(course.record_id);
            const type = f['课程类型'] || f['类型'] || '未分类';
            const code = f['课程代码'] || f['课程编号'] || '';
            const hours = f['学时'] || f['总学时'] || '';
            const credits = f['学分'] || '';

            return (
              <div key={course.record_id} className="teaching-course-card">
                <div className="teaching-course-header">
                  <h3 className="teaching-course-name">{f['课程名称'] || f['名称'] || '未命名课程'}</h3>
                  <span className="teaching-course-type">{type}</span>
                </div>
                {code && <div className="teaching-course-code">课程代码：{code}</div>}
                <div className="teaching-course-meta">
                  {hours && <span>📖 {hours}学时</span>}
                  {credits && <span>⭐ {credits}学分</span>}
                </div>
                <div className="teaching-course-teachers">
                  <span className="teaching-course-teachers-label">授课教师：</span>
                  {courseTeachers.length > 0 ? (
                    courseTeachers.map(t => (
                      <span key={t.record_id} className="teaching-teacher-chip">
                        {t.fields['姓名'] || t.fields['教师姓名'] || '未知'}
                      </span>
                    ))
                  ) : (
                    <span className="teaching-muted">未分配</span>
                  )}
                </div>
                <div className="teaching-course-progress">
                  <div className="teaching-progress-bar-sm">
                    <div className="teaching-progress-fill-sm" style={{ width: progress + '%' }}></div>
                  </div>
                  <span className="teaching-progress-text">大纲完成 {progress}%</span>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

  const [semesterFilter, setSemesterFilter] = React.useState('all');
  const [searchText, setSearchText] = React.useState('');

  const categories = React.useMemo(() => {
    const set = new Set();
    works.forEach(w => {
      const c = w.fields['分类'] || w.fields['工作分类'] || '未分类';
      set.add(c);
    });
    return Array.from(set);
  }, [works]);

  const statuses = React.useMemo(() => {
    const set = new Set();
    works.forEach(w => {
      const s = w.fields['状态'] || '待执行';
      set.add(s);
    });
    return Array.from(set);
  }, [works]);

  const filteredWorks = React.useMemo(() => {
    return works.filter(w => {
      if (categoryFilter !== 'all') {
        const cat = w.fields['分类'] || w.fields['工作分类'] || '未分类';
        if (cat !== categoryFilter) return false;
      }
      if (statusFilter !== 'all') {
        const st = w.fields['状态'] || '待执行';
        if (st !== statusFilter) return false;
      }
      if (semesterFilter !== 'all') {
        const sems = w.fields['所属学期'];
        const semArr = Array.isArray(sems) ? sems : (sems ? [sems] : []);
        if (!semArr.includes(semesterFilter)) return false;
      }
      if (searchText) {
        const name = getWorkName(w.fields);
        const detail = w.fields['工作详情'] || w.fields['详情'] || '';
        if (!name.includes(searchText) && !detail.includes(searchText)) return false;
      }
      return true;
    }).sort((a, b) => (b.fields['截止日期'] || 0) - (a.fields['截止日期'] || 0));
  }, [works, categoryFilter, statusFilter, semesterFilter, searchText]);

  const getSemesterName = (semIds) => {
    if (!semIds) return '—';
    const ids = Array.isArray(semIds) ? semIds : [semIds];
    const names = ids.map(id => {
      const s = semesters.find(sem => sem.record_id === id);
      return s ? s.fields['学期名称'] : id;

    return names.join('、');

              onClick={() => setCategoryFilter('all')}

              全部

            {categories.map(c => (
              <button
                key={c}
                className={'teaching-filter-btn' + (categoryFilter === c ? ' active' : '')}
                onClick={() => setCategoryFilter(c)}
              >
                {c}
              </button>
            ))}
          </div>

          <div className="teaching-filter-group">
            <span className="teaching-filter-label">状态</span>
            <button
              className={'teaching-filter-btn' + (statusFilter === 'all' ? ' active' : '')}
              onClick={() => setStatusFilter('all')}
            >
              全部
            </button>
            {statuses.map(s => (
              <button
                key={s}
                className={'teaching-filter-btn' + (statusFilter === s ? ' active' : '')}
                onClick={() => setStatusFilter(s)}

                {s}
              </button>
            ))}
          </div>

          <div className="teaching-filter-group">
            <span className="teaching-filter-label">学期</span>
            <button
              className={'teaching-filter-btn' + (semesterFilter === 'all' ? ' active' : '')}

              全部
            </button>
            {semesters.map(s => (
              <button
                key={s.record_id}
                className={'teaching-filter-btn' + (semesterFilter === s.record_id ? ' active' : '')}
                onClick={() => setSemesterFilter(s.record_id)}

            ))}

          <div className="teaching-filter-search">
            <input

        </div>

        {filteredWorks.length === 0 ? (
          <div className="teaching-empty">暂无符合条件的工作</div>

function SemesterCheckTimeline({ semester }) {
  const cycles = getSemesterCheckCycles(semester);
  const progress = calcSemesterProgress(semester);
  const currentWeek = progress.currentWeek;
  const totalWeeks = progress.totalWeeks || 18;

  if (cycles.length === 0) return null;

  const currentCycle = getCurrentCheckCycle(semester);

  return (
    <div className="teaching-card">
      <div className="teaching-card-title">
        <span>📅</span> 学期教学检查周期
        {currentCycle && (
          <span className="teaching-card-badge" style={{ background: currentCycle.color + '22', color: currentCycle.color }}>
            当前：{currentCycle.name}
          </span>
        )}
      </div>
      
      <div className="check-timeline">
        <div className="check-timeline-track">
          {cycles.map((c, i) => {
            const leftPct = ((c.startWeek - 1) / totalWeeks) * 100;
            const widthPct = ((c.endWeek - c.startWeek + 1) / totalWeeks) * 100;
            const isActive = currentWeek >= c.startWeek && currentWeek <= c.endWeek;
            return (
              <div
                key={c.name}
                className={'check-cycle-segment' + (isActive ? ' active' : '')}
                style={{
                  left: leftPct + '%',
                  width: widthPct + '%',
                  background: c.color + '33',
                  borderColor: c.color,
                }}
              >
                <div className="check-cycle-icon" style={{ color: c.color }}>{c.icon}</div>
                <div className="check-cycle-name">{c.name}</div>
                <div className="check-cycle-weeks">第{c.startWeek}-{c.endWeek}周</div>
              </div>
            );
          })}
          
          {currentWeek > 0 && (
            <div
              className="check-timeline-marker"
              style={{ left: ((currentWeek - 1) / totalWeeks) * 100 + '%' }}
            >
              <div className="check-marker-dot"></div>
              <div className="check-marker-label">第{currentWeek}周</div>
            </div>
          )}
        </div>
        
        <div className="check-timeline-ruler">
          <span>第1周</span>
          <span>第{Math.floor(totalWeeks/2)}周</span>
          <span>第{totalWeeks}周</span>
        </div>
      </div>
    </div>
  );
}

const DAILY_CONFIG = {
  appToken: 'ZGcrbdAztars3CsTFtAcUciLn9e',
  tableId: 'tblIGRAi03nsw8Sm',
};

// 获取最近N天的日期数组（倒序）
function getRecentDays(n) {
  const days = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; i < n; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    days.push(d);
  }
  return days;
}

// 获取星期几的中文
function getWeekdayCN(date) {
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return weekdays[date.getDay()];
}

// 格式化日期为 YYYY-MM-DD
function fmtDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// 拉取日报表数据（最近N天）
async function fetchDailyRecords(days = 30) {
  const { appToken, tableId } = DAILY_CONFIG;
  const allItems = [];
  let pageToken = '';
  let hasMore = true;
  try {
    while (hasMore) {
      const url = `/bitable/v1/apps/${appToken}/tables/${tableId}/records/search`;
      const body = { page_size: 500 };
      if (pageToken) body.page_token = pageToken;
      const data = await feishuRequest(url, { method: 'POST', body: JSON.stringify(body) });
      allItems.push(...(data.items || []));
      hasMore = data.has_more;
      pageToken = data.page_token || '';
    }
  } catch (e) {
    console.warn('拉取日报表失败:', e.message);
    return [];
  }
  return allItems.map(item => {
    const cleaned = cleanFields(item.fields);
    // 日期字段统一转为 YYYY-MM-DD 字符串
    if (cleaned['日期']) {
      const ts = Array.isArray(cleaned['日期']) ? cleaned['日期'][0] : cleaned['日期'];
      if (typeof ts === 'number') {
        cleaned['日期'] = fmtDateStr(new Date(ts));
      }
    }
    return { ...item, fields: cleaned };
  });
}

// 将日期字段转为飞书API接受的格式（毫秒时间戳）
function _convertDateField(fields) {
  const result = { ...fields };
  if (result['日期'] && typeof result['日期'] === 'string') {
    result['日期'] = new Date(result['日期'] + 'T00:00:00').getTime();
  }
  return result;
}

// 创建日报记录
async function createDailyRecord(fields) {
  const { appToken, tableId } = DAILY_CONFIG;
  const data = await feishuRequest(
    `/bitable/v1/apps/${appToken}/tables/${tableId}/records`,
    { method: 'POST', body: JSON.stringify({ fields: _convertDateField(fields) }) }
  );
  const item = data.record;
  const cleaned = cleanFields(item.fields);
  if (cleaned['日期']) {
    const ts = Array.isArray(cleaned['日期']) ? cleaned['日期'][0] : cleaned['日期'];
    if (typeof ts === 'number') cleaned['日期'] = fmtDateStr(new Date(ts));
  }
  return { ...item, fields: cleaned };
}

// 更新日报记录
async function updateDailyRecord(recordId, fields) {
  const { appToken, tableId } = DAILY_CONFIG;
  const data = await feishuRequest(
    `/bitable/v1/apps/${appToken}/tables/${tableId}/records/${recordId}`,
    { method: 'PUT', body: JSON.stringify({ fields: _convertDateField(fields) }) }
  );
  const item = data.record;
  const cleaned = cleanFields(item.fields);
  if (cleaned['日期']) {
    const ts = Array.isArray(cleaned['日期']) ? cleaned['日期'][0] : cleaned['日期'];
    if (typeof ts === 'number') cleaned['日期'] = fmtDateStr(new Date(ts));
  }
  return { ...item, fields: cleaned };
}

// 从通知模块拉取当日数据（已完成任务、进行中任务、今日会议）
// 注：此为骨架创建时的占位函数，实际数据来源由后端/自动化脚本填充

/* ==========================================================
   组件：日报中心主页面
   ========================================================== */

function DailyPage() {
  const { path } = useHashRoute();
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [selectedDate, setSelectedDate] = useState('');
  const [editData, setEditData] = useState({});
  const [saving, setSaving] = useState(false);
  const [hasUnsaved, setHasUnsaved] = useState(false);

  // 模块锁定状态
  const [moduleLocked, setModuleLocked] = useState(false);
  const [moduleUnlocked, setModuleUnlocked] = useState(false);
  const [showLockModal, setShowLockModal] = useState(false);

  const modulePath = '/daily';

  const refreshModuleLock = () => {
    const locked = isModuleLocked(modulePath);
    setModuleLocked(locked);
    setModuleUnlocked(locked ? isSessionUnlocked(modulePath) : true);
  };

  useEffect(() => {
    refreshModuleLock();
    const onStorage = () => refreshModuleLock();
    const onLockChange = () => refreshModuleLock();
    window.addEventListener('storage', onStorage);
    window.addEventListener('oc_lock_changed', onLockChange);
    return () => {
      window.removeEventListener('storage', onStorage);
      window.removeEventListener('oc_lock_changed', onLockChange);
    };
  }, []);

  const handleModuleUnlock = () => {
    setSessionUnlocked(modulePath, true);
    setModuleUnlocked(true);
    setShowLockModal(false);
  };

  // 从URL参数解析日期
  const getDateFromHash = () => {
    const hash = window.location.hash || '';
    const qIndex = hash.indexOf('?');
    if (qIndex === -1) return null;
    const qs = hash.substring(qIndex + 1);
    const params = new URLSearchParams(qs);
    return params.get('date');
  };

  const loadData = async () => {
    setLoading(true);
    setError('');
    try {
      const data = await fetchDailyRecords(30);
      setRecords(data);

      // 设置选中日期
      const dateFromUrl = getDateFromHash();
      const today = fmtDateStr(new Date());
      if (dateFromUrl) {
        setSelectedDate(dateFromUrl);
      } else {
        setSelectedDate(today);
      }
    } catch (e) {
      setError('加载失败：' + (e.message || '未知错误'));
    }
    setLoading(false);
  };

  useEffect(() => { loadData(); }, []);

  // 监听hash变化中的date参数
  useEffect(() => {
    const dateFromUrl = getDateFromHash();
    if (dateFromUrl && dateFromUrl !== selectedDate) {
      setSelectedDate(dateFromUrl);
    }
  }, [path]);

  // 选中日期变化时，重置编辑状态
  useEffect(() => {
    if (!selectedDate || records.length === 0) return;
    const record = records.find(r => r.fields['日期'] === selectedDate);
    if (record) {
      setEditData({
        '临时工作': record.fields['临时工作'] || '',
        '明日计划': record.fields['明日计划'] || '',
        '反思备注': record.fields['反思备注'] || '',
      });
    } else {
      setEditData({ '临时工作': '', '明日计划': '', '反思备注': '' });
    }
    setHasUnsaved(false);
  }, [selectedDate, records]);

  const handleDateSelect = (dateStr) => {
    setSelectedDate(dateStr);
    // 更新URL
    const basePath = path.split('?')[0];
    window.location.hash = `${basePath}?date=${dateStr}`;
  };

  const handleGoToday = () => {
    const today = fmtDateStr(new Date());
    handleDateSelect(today);
  };

  const handleFieldChange = (field, value) => {
    setEditData(prev => ({ ...prev, [field]: value }));
    setHasUnsaved(true);
  };

  const handleSave = async () => {
    if (!selectedDate) return;
    const record = records.find(r => r.fields['日期'] === selectedDate);

    setSaving(true);
    try {
      if (record) {
        // 更新现有记录
        const updated = await updateDailyRecord(record.record_id, {
          '临时工作': editData['临时工作'] || '',
          '明日计划': editData['明日计划'] || '',
          '反思备注': editData['反思备注'] || '',
        });
        setRecords(prev => prev.map(r =>
          r.record_id === record.record_id ? updated : r
        ));
      } else {
        // 创建新记录（骨架）
        const dateObj = new Date(selectedDate);
        const weekday = getWeekdayCN(dateObj);
        const fields = {

// 紧急程度定义
const URGENCY_LEVELS = [
  { key: 'critical', label: '特急', color: 'red', icon: '🔴', maxHours: 24 },
  { key: 'urgent', label: '紧急', color: 'orange', icon: '🟠', minHours: 24, maxHours: 48 },
  { key: 'normal', label: '常规', color: 'yellow', icon: '🟡', minHours: 48, maxHours: 168 },
  { key: 'medium', label: '中期', color: 'green', icon: '🟢', minHours: 168, maxHours: 672 },
  { key: 'longterm', label: '远期', color: 'blue', icon: '🔵', minHours: 672 },
];

// 根据截止时间计算紧急程度

// 解析截止时间（兼容毫秒字符串/ISO字符串/数组/时间戳）
function parseDeadline(val) {
  if (!val) return null;
  if (Array.isArray(val)) val = val[0];
  if (!val) return null;
  // 如果是纯数字字符串（毫秒时间戳）
  if (typeof val === 'string' && /^\d+$/.test(val)) {
    const n = Number(val);
    if (n > 1e12) return new Date(n); // 毫秒
    if (n > 1e9) return new Date(n * 1000); // 秒
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}
function calcUrgency(deadline, createdAt) {
  const d = parseDeadline(deadline);
  if (!d) return URGENCY_LEVELS[2]; // 默认常规
  const now = new Date();
  const diffMs = d - now;
  const diffHours = diffMs / (1000 * 60 * 60);
  for (const level of URGENCY_LEVELS) {
    if (level.maxHours !== undefined && diffHours <= level.maxHours) {
      if (level.minHours === undefined || diffHours > level.minHours || level.key === 'critical') {
        return level;
      }
    }
    if (level.minHours !== undefined && level.maxHours === undefined && diffHours > level.minHours) {
      return level;
    }
  }
  return URGENCY_LEVELS[4]; // 默认远期
}

// 计算倒计时显示
function formatCountdown(deadline) {
  if (!deadline) return '无截止时间';
  const now = new Date();
  const diff = new Date(deadline) - now;
  if (diff <= 0) return '已过期';
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  if (days > 0) return `还剩 ${days} 天 ${hours} 小时`;
  if (hours > 0) return `还剩 ${hours} 小时 ${minutes} 分`;
  return `还剩 ${minutes} 分钟`;
}

// 计算工作时间内的剩余时间（简化版）
function calcWorkingTimeLeft(deadline) {
  const d = parseDeadline(deadline);
  if (!d) return { text: '无截止时间', percent: 0 };
  return { text: formatCountdown(d), percent: 0 };
}

// 进度偏差算法
function calcProgressDeviation(createdAt, deadline, taskProgress) {
  const d = parseDeadline(deadline);
  if (!createdAt || !d) return { level: 'normal', deviation: 0 };
  const now = Date.now();
  const createTime = new Date(createdAt).getTime();
  const deadTime = d.getTime();
  const totalDuration = deadTime - createTime;
  if (totalDuration <= 0) return { level: 'normal', deviation: 0 };
  const timeProgress = Math.min(100, Math.max(0, ((now - createTime) / totalDuration) * 100));
  const deviation = timeProgress - (taskProgress || 0);
  let level = 'normal';
  if (deviation > 50) level = 'critical';
  else if (deviation > 15) level = 'warning';
  return { level, deviation: Math.round(deviation), timeProgress: Math.round(timeProgress) };
}

// 拉取通知相关表数据
async function fetchNotificationTable(tableKey) {
  const { appToken, tables } = NOTIFICATION_CONFIG;
  const tableId = tables[tableKey];
  if (!tableId) return [];
  const allItems = [];
  let pageToken = '';
  let hasMore = true;
  try {
    while (hasMore) {
      const url = `/bitable/v1/apps/${appToken}/tables/${tableId}/records/search`;
      const body = { page_size: 500 };
      if (pageToken) body.page_token = pageToken;
      const data = await feishuRequest(url, { method: 'POST', body: JSON.stringify(body) });
      allItems.push(...(data.items || []));
      hasMore = data.has_more;
      pageToken = data.page_token || '';
    }
  } catch (e) {
    console.warn(`拉取通知表 ${tableKey} 失败:`, e.message);
    return [];
  }
  return allItems.map(item => ({ ...item, fields: cleanFields(item.fields) }));
}

// 格式化日期
function notifFormatDate(date) {
  if (!date) return '';
  const d = new Date(date);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const isTomorrow = d.toDateString() === tomorrow.toDateString();
  if (isToday) return `今天 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
  if (isTomorrow) return `明天 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
  return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
}

              onClick={() => setShowLockModal(true)}
              title="点击解锁"
            >
              🔒
            </div>
          </div>
        </div>
      )}

      {/* 主内容区 */}
      {(!moduleLocked || moduleUnlocked) && (
        <>
          <div className="notification-layout">
            {/* 左侧导航 */}
            <aside className="notification-sidebar">
              {navItems.map(item => (
                <div
                  key={item.key}
                  className={'notification-nav-item' + (activeNav === item.key ? ' active' : '')}
                  onClick={() => navigateTo(item.key)}
                >
                  <span className="notification-nav-icon">{item.icon}</span>
                  <span className="notification-nav-label">{item.label}</span>
                </div>
              ))}
            </aside>

            {/* 右侧内容 */}
            <main className="notification-content">
              {activeNav === 'overview' && (
                <NotificationOverview data={data} onViewNotif={setSelectedNotif} />
              )}
              {activeNav === 'notifications' && (
                <NotificationList
                  notifications={data.notifications}
                  categories={data.categories}
                  onView={setSelectedNotif}
                  onRefresh={loadData}
                />
              )}
              {activeNav === 'tasks' && (
                <NotificationTasks tasks={data.tasks} notifications={data.notifications} />
              )}
              {activeNav === 'categories' && (
                <NotificationCategories
                  categories={data.categories}
                  onRefresh={loadData}
                />
              )}
            </main>
          </div>

          {/* 快速录入浮动按钮 */}
          <button className="notif-fab" onClick={() => setShowQuickAdd(true)} title="快速录入">
            +
          </button>
        </>
      )}

      {/* 快速录入弹窗 */}
      {showQuickAdd && (
        <NotificationQuickAddModal
          categories={data.categories}
          teachingWorks={data.teachingWorks || []}
          onClose={() => setShowQuickAdd(false)}
          onSuccess={() => { setShowQuickAdd(false); loadData(); }}
        />
      )}

      {/* 通知详情抽屉 */}
      {selectedNotif && (
        <NotificationDetailDrawer
          notification={selectedNotif}
          tasks={data.tasks}
          files={data.files}
          reminders={data.reminders}
          teachingWorks={data.teachingWorks || []}
          onClose={() => setSelectedNotif(null)}
        />
      )}

      {/* 模块锁定弹窗 */}
      {showLockModal && (
        <ModuleUnlockModal
          title="解锁「通知信息消化中心」"
          onSuccess={handleModuleUnlock}
          onClose={() => setShowLockModal(false)}
        />
      )}
    </div>
  );
}

/* ==========================================================
   子组件：总览看板
   ========================================================== */

function NotificationOverview({ data, onViewNotif }) {
  const { notifications, tasks } = data;

  // 统计数据
  const pendingCount = notifications.filter(n => {
    const status = n.fields['状态'] || n.fields['通知状态'] || '待处理';
    return status === '待处理';
  }).length;

  const inProgressTasks = tasks.filter(t => {
    const status = t.fields['状态'] || t.fields['任务状态'] || '待执行';
    return status === '进行中';
  }).length;

  // 今日截止
  const today = new Date();
  today.setHours(23, 59, 59, 999);
  const todayDeadlineCount = notifications.filter(n => {
    const dl = n.fields['截止时间'];
    if (!dl) return false;
    const dlDate = Array.isArray(dl) ? new Date(dl[0]) : new Date(dl);
    return dlDate <= today && dlDate >= new Date(new Date().setHours(0,0,0,0));
  }).length;

  // 本周归档
  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  weekStart.setHours(0, 0, 0, 0);
  const weekArchivedCount = notifications.filter(n => {
    const status = n.fields['状态'] || n.fields['通知状态'] || '';
    return status === '已归档';
  }).length;

  // 紧急程度分布
  const urgencyStats = URGENCY_LEVELS.map(level => {
    const count = notifications.filter(n => {
      const dl = n.fields['截止时间'];
      const dlVal = Array.isArray(dl) ? dl[0] : dl;
      const urgency = calcUrgency(dlVal);
      return urgency.key === level.key;
    }).length;
    return { ...level, count };
  });

  // 今日待办时间线
  const todayItems = notifications
    .filter(n => {
      const status = n.fields['状态'] || n.fields['通知状态'] || '待处理';
      if (status === '已完成' || status === '已归档') return false;
      const dl = n.fields['截止时间'];
      if (!dl) return false;
      const dlDate = Array.isArray(dl) ? new Date(dl[0]) : new Date(dl);
      return dlDate <= today;
    })
    .map(n => {
      const dl = n.fields['截止时间'];
      const dlVal = Array.isArray(dl) ? dl[0] : dl;
      return { ...n, _deadline: dlVal, _urgency: calcUrgency(dlVal) };
    })
    .sort((a, b) => new Date(a._deadline) - new Date(b._deadline))
    .slice(0, 8);

  // 最近7天趋势（模拟数据，实际从数据计算）
  const last7Days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0, 0, 0, 0);
    const nextDay = new Date(d);
    nextDay.setDate(d.getDate() + 1);
    const added = notifications.filter(n => {
      const ct = n.fields['创建时间'] || n.created_time;
      if (!ct) return false;
      const ctTime = new Date(ct).getTime();
      return ctTime >= d.getTime() && ctTime < nextDay.getTime();
    }).length;
    const done = notifications.filter(n => {
      const status = n.fields['状态'] || n.fields['通知状态'] || '';
      return status === '已完成';
    }).filter(n => {
      const lt = n.fields['完成时间'] || n.last_modified_time;
      if (!lt) return false;
      const ltTime = new Date(lt).getTime();
      return ltTime >= d.getTime() && ltTime < nextDay.getTime();
    }).length;
    last7Days.push({
      label: `${d.getMonth()+1}/${d.getDate()}`,
      added, done,
      maxAdded: 0,
    });
  }
  const maxVal = Math.max(1, ...last7Days.flatMap(d => [d.added, d.done]));

  return (
    <div>
      {/* 统计卡片 */}
      <div className="notif-overview-grid">
        <div className="notif-stat-card notif-stat-pending">
          <div className="notif-stat-icon">📥</div>
          <div className="notif-stat-label">待处理通知</div>
          <div className="notif-stat-value">{pendingCount}</div>
        </div>
        <div className="notif-stat-card notif-stat-progress">
          <div className="notif-stat-icon">⏳</div>
          <div className="notif-stat-label">进行中任务</div>
          <div className="notif-stat-value">{inProgressTasks}</div>
        </div>
        <div className="notif-stat-card notif-stat-today">
          <div className="notif-stat-icon">⏰</div>
          <div className="notif-stat-label">今日截止</div>
          <div className="notif-stat-value">{todayDeadlineCount}</div>
        </div>
        <div className="notif-stat-card notif-stat-archived">
          <div className="notif-stat-icon">📦</div>
          <div className="notif-stat-label">本周归档</div>
          <div className="notif-stat-value">{weekArchivedCount}</div>
        </div>
      </div>

      {/* 紧急程度分布 */}
      <div className="notif-section">
        <div className="notif-section-title">紧急程度分布</div>
        <div className="notif-urgency-row">
          {urgencyStats.map(item => (
            <div key={item.key} className="notif-urgency-item">
              <div className={`notif-urgency-dot ${item.color}`}></div>
              <div className="notif-urgency-count">{item.count}</div>
              <div className="notif-urgency-label">{item.icon} {item.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="notif-two-col">
        {/* 今日待办时间线 */}
        <div className="notif-section">
          <div className="notif-section-title">今日待办</div>
          <div className="notif-timeline">
            {todayItems.length === 0 ? (
              <div className="notif-empty">
                <div className="notif-empty-icon">🎉</div>
                <div className="notif-empty-text">今日没有待办事项</div>
              </div>
            ) : (
              todayItems.map(item => (
                <div
                  key={item.record_id}
                  className="notif-timeline-item"
                  onClick={() => onViewNotif && onViewNotif(item)}
                  style={{ cursor: 'pointer' }}
                >
                  <div className={`notif-timeline-dot ${item._urgency.color}`}></div>
                  <div className="notif-timeline-content">
                    <div className="notif-timeline-title">
                      {item.fields['标题'] || item.fields['通知标题'] || '未命名通知'}
                    </div>
                    <div className="notif-timeline-meta">
                      <span>{notifFormatDate(item._deadline)}</span>
                      <span>{item._urgency.icon} {item._urgency.label}</span>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>

        {/* 最近7天趋势 */}
        <div className="notif-section">
          <div className="notif-section-title">最近7天趋势</div>
          <div className="notif-trend-chart">
            {last7Days.map((day, i) => (
              <div key={i} className="notif-trend-bar">
                <div className="notif-trend-bar-bars">
                  <div
                    className="notif-trend-bar-add"
                    style={{ height: `${(day.added / maxVal) * 100}%` }}
                    title={`新增 ${day.added}`}
                  ></div>
                  <div
                    className="notif-trend-bar-done"
                    style={{ height: `${(day.done / maxVal) * 100}%` }}
                    title={`完成 ${day.done}`}
                  ></div>
                </div>
                <div className="notif-trend-bar-label">{day.label}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex', gap:'16px', marginTop:'10px', fontSize:'12px', color:'var(--text-secondary)'}}>
            <span><span style={{display:'inline-block', width:'10px', height:'10px', background:'#3b82f6', borderRadius:'2px', marginRight:'4px'}}></span>新增</span>
            <span><span style={{display:'inline-block', width:'10px', height:'10px', background:'#22c55e', borderRadius:'2px', marginRight:'4px'}}></span>完成</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ==========================================================
   子组件：通知列表
   ========================================================== */

function NotificationList({ notifications, categories, onView, onRefresh }) {
  const [filterCategory, setFilterCategory] = React.useState('');
  const [filterUrgency, setFilterUrgency] = React.useState('');
  const [filterStatus, setFilterStatus] = React.useState('');
  const [search, setSearch] = React.useState('');

  const categoryNames = categories.map(c => c.fields['名称'] || c.fields['分类名称'] || '').filter(Boolean);

  const filtered = notifications.filter(n => {
    const title = n.fields['标题'] || n.fields['通知标题'] || '';
    const content = n.fields['内容'] || n.fields['通知内容'] || '';
    const cat = n.fields['分类'] || '';
    const status = n.fields['状态'] || n.fields['通知状态'] || '待处理';
    const dl = n.fields['截止时间'];
    const dlVal = Array.isArray(dl) ? dl[0] : dl;
    const urgency = calcUrgency(dlVal);

    if (filterCategory && cat !== filterCategory) return false;
    if (filterUrgency && urgency.key !== filterUrgency) return false;
    if (filterStatus && status !== filterStatus) return false;
    if (search) {
      const kw = search.toLowerCase();
      if (!title.toLowerCase().includes(kw) && !String(content).toLowerCase().includes(kw)) return false;
    }
    return true;
  }).sort((a, b) => {
    // 按截止时间升序
    const dlA = a.fields['截止时间'];
    const dlB = b.fields['截止时间'];
    const valA = Array.isArray(dlA) ? dlA[0] : dlA;
    const valB = Array.isArray(dlB) ? dlB[0] : dlB;
    if (valA && valB) return new Date(valA) - new Date(valB);
    if (valA) return -1;
    if (valB) return 1;
    return 0;
  });

  const handleMarkDone = async (record) => {
    try {
      const { appToken, tables } = NOTIFICATION_CONFIG;
      const url = `/bitable/v1/apps/${appToken}/tables/${tables.main}/records/${record.record_id}`;
      await feishuRequest(url, {
        method: 'PATCH',
        body: JSON.stringify({ fields: { '状态': '已完成' } })
      });
      if (onRefresh) onRefresh();
    } catch (e) {
      alert('操作失败：' + e.message);
    }
  };

  const handleArchive = async (record) => {
    try {
      const { appToken, tables } = NOTIFICATION_CONFIG;
      const url = `/bitable/v1/apps/${appToken}/tables/${tables.main}/records/${record.record_id}`;
      await feishuRequest(url, {
        method: 'PATCH',
        body: JSON.stringify({ fields: { '状态': '已归档' } })
      });
      if (onRefresh) onRefresh();
    } catch (e) {
      alert('操作失败：' + e.message);
    }
  };

  return (
    <div>
      {/* 筛选栏 */}
      <div className="notif-filter-bar">
        <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
          <option value="">全部分类</option>
          {categoryNames.map(name => (
            <option key={name} value={name}>{name}</option>
          ))}
        </select>
        <select value={filterUrgency} onChange={e => setFilterUrgency(e.target.value)}>
          <option value="">全部紧急度</option>
          {URGENCY_LEVELS.map(u => (
            <option key={u.key} value={u.key}>{u.icon} {u.label}</option>
          ))}
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
          <option value="">全部状态</option>
          <option value="待处理">待处理</option>
          <option value="进行中">进行中</option>
          <option value="已完成">已完成</option>
          <option value="已归档">已归档</option>
        </select>
        <input
          type="text"
          placeholder="🔍 搜索通知标题或内容..."
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      {/* 通知列表 */}
      {filtered.length === 0 ? (
        <div className="notif-empty">
          <div className="notif-empty-icon">📭</div>
          <div className="notif-empty-text">暂无通知数据</div>
        </div>
      ) : (
        <div className="notif-list">
          {filtered.map(n => {
            const title = n.fields['标题'] || n.fields['通知标题'] || '未命名通知';
            const category = n.fields['通知分类'] || n.fields['分类'] || '';
            const dl = n.fields['截止时间'];
            const dlVal = Array.isArray(dl) ? dl[0] : dl;
            const urgency = calcUrgency(dlVal);
            const status = n.fields['状态'] || n.fields['通知状态'] || '待处理';
            const source = n.fields['通知来源'] || n.fields['来源'] || '';
            const progress = Number(n.fields['完成进度'] || n.fields['进度'] || n.fields['任务进度'] || 0);
            const createdAt = n.created_time || n.fields['创建时间'] || '';

            return (
              <div key={n.record_id} className="notif-card" onClick={() => onView && onView(n)}>
                <div className={`notif-card-urgency ${urgency.color}`}></div>
                <div className="notif-card-body">
                  <div className="notif-card-top">
                    <div>
                      <h3 className="notif-card-title">{title}</h3>
                      <div className="notif-card-tags">
                        {category && <span className="notif-tag gray">{category}</span>}
                        <span className={`notif-tag ${urgency.color}`}>{urgency.icon} {urgency.label}</span>
                        <span className={`notif-tag ${status === '已完成' ? 'green' : status === '已归档' ? 'gray' : status === '进行中' ? 'blue' : 'yellow'}`}>
                          {status}
                        </span>
                      </div>
                    </div>
                  </div>
                  <div className="notif-card-deadline">⏰ {formatCountdown(dlVal)} <span style={{fontSize:'10px',opacity:0.5}}>[raw: {String(dlVal).slice(0,20)}]</span></div>
                  <div className="notif-card-progress">
                    <div className="notif-card-progress-bar" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="notif-card-bottom">
                    <span>
                      {source && `来源：${source} · `}
                      创建于 {createdAt ? new Date(createdAt).toLocaleDateString('zh-CN') : '未知'}
                    </span>
                    <div className="notif-card-actions" onClick={e => e.stopPropagation()}>
                      <button className="notif-card-btn primary" onClick={() => handleMarkDone(n)}>完成</button>
                      <button className="notif-card-btn" onClick={() => handleArchive(n)}>归档</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ==========================================================
   子组件：任务追踪
   ========================================================== */

function NotificationTasks({ tasks, notifications }) {
  const taskGroups = [
    { key: '待执行', label: '待执行', color: 'gray' },
    { key: '进行中', label: '进行中', color: 'blue' },
    { key: '已完成', label: '已完成', color: 'green' },
  ];

  const notifMap = {};
  notifications.forEach(n => { notifMap[n.record_id] = n; });

  return (
    <div>
      {taskGroups.map(group => {
        const groupTasks = tasks.filter(t => {
          const status = t.fields['状态'] || t.fields['任务状态'] || '待执行';
          return status === group.key;
        });

        return (
          <div key={group.key} className="notif-task-group">
            <div className="notif-task-group-title">
              {group.label}
              <span className="notif-task-group-count">{groupTasks.length}</span>
            </div>
            {groupTasks.length === 0 ? (
              <div className="notif-empty" style={{ padding: '30px' }}>
                <div className="notif-empty-text">暂无{group.label}任务</div>
              </div>
            ) : (
              <div className="notif-task-list">
                {groupTasks.map(t => {
                  const title = t.fields['任务名称'] || t.fields['标题'] || '未命名任务';
                  const progress = Number(t.fields['进度'] || t.fields['任务进度'] || 0);
                  const dl = t.fields['截止时间'];
                  const dlVal = Array.isArray(dl) ? dl[0] : dl;
                  const owner = t.fields['负责人'] || '';
                  const notifIds = t.fields['关联通知'] || t.fields['所属通知'] || [];
                  const notifId = Array.isArray(notifIds) ? notifIds[0] : notifIds;
                  const notif = notifMap[notifId];

                  return (
                    <div key={t.record_id} className="notif-task-card">
                      <div className="notif-task-title">{title}</div>
                      <div className="notif-task-meta">
                        {notif && <span>📋 {notif.fields['标题'] || notif.fields['通知标题'] || '关联通知'}</span>}
                        {dlVal && <span>⏰ {notifFormatDate(dlVal)}</span>}
                        {owner && <span>👤 {owner}</span>}
                      </div>
                      <div className="notif-task-progress">
                        <div className="notif-task-progress-bar" style={{ width: `${progress}%` }}></div>
                      </div>
                      <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                        进度 {progress}%
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ==========================================================
   子组件：分类配置
   ========================================================== */

function NotificationCategories({ categories, onRefresh }) {
  const [showForm, setShowForm] = React.useState(false);
  const [editingCat, setEditingCat] = React.useState(null);
  const [formData, setFormData] = React.useState({
    name: '', icon: '📁', defaultUrgency: 'normal', sort: 10, desc: '',
  });
  const [saving, setSaving] = React.useState(false);

  // 若表中无数据，显示默认分类
  const displayCategories = categories.length > 0
    ? categories.sort((a, b) => {
        const sa = Number(a.fields['排序'] || a.fields['sort'] || 999);
        const sb = Number(b.fields['排序'] || b.fields['sort'] || 999);
        return sa - sb;
      })
    : DEFAULT_CATEGORIES.map((c, i) => ({
        record_id: `default-${i}`,
        fields: {
          '名称': c.name,
          '图标': c.icon,
          '默认紧急度': c.defaultUrgency,
          '排序': c.sort,
          '描述': c.desc,
        }
      }));

  const openAdd = () => {
    setEditingCat(null);
    setFormData({ name: '', icon: '📁', defaultUrgency: 'normal', sort: 10, desc: '' });
    setShowForm(true);
  };

  const openEdit = (cat) => {
    const f = cat.fields;
    setEditingCat(cat);
    setFormData({
      name: f['名称'] || f['分类名称'] || '',
      icon: f['图标'] || '📁',
      defaultUrgency: f['默认紧急度'] || f['defaultUrgency'] || 'normal',
      sort: Number(f['排序'] || f['sort'] || 10),
      desc: f['描述'] || f['desc'] || '',
    });
    setShowForm(true);
  };

  const handleSave = async () => {
    if (!formData.name.trim()) {
      alert('请输入分类名称');
      return;
    }
    setSaving(true);
    try {
      const { appToken, tables } = NOTIFICATION_CONFIG;
      const fields = {
        '名称': formData.name,
        '图标': formData.icon,
        '默认紧急度': formData.defaultUrgency,
        '排序': formData.sort,
        '描述': formData.desc,
      };

      if (editingCat && editingCat.record_id && !editingCat.record_id.startsWith('default-')) {
        const url = `/bitable/v1/apps/${appToken}/tables/${tables.category}/records/${editingCat.record_id}`;
        await feishuRequest(url, {
          method: 'PATCH',
          body: JSON.stringify({ fields })
        });
      } else {
        const url = `/bitable/v1/apps/${appToken}/tables/${tables.category}/records`;
        await feishuRequest(url, {
          method: 'POST',
          body: JSON.stringify({ fields })
        });
      }

      setShowForm(false);
      if (onRefresh) onRefresh();
    } catch (e) {
      alert('保存失败：' + e.message);
    }
    setSaving(false);
  };

  const handleDelete = async (cat) => {
    if (!confirm('确定删除该分类？')) return;
    if (cat.record_id.startsWith('default-')) {
      alert('默认分类不可删除');
      return;
    }
    try {
      const { appToken, tables } = NOTIFICATION_CONFIG;
      const url = `/bitable/v1/apps/${appToken}/tables/${tables.category}/records/${cat.record_id}`;
      await feishuRequest(url, { method: 'DELETE' });
      if (onRefresh) onRefresh();
    } catch (e) {
      alert('删除失败：' + e.message);

function NotificationQuickAddModal({ categories, onClose, onSuccess }) {
  const [formData, setFormData] = React.useState({
    title: '', content: '', category: '', urgency: '', deadline: '', source: '',
  });
  const [submitting, setSubmitting] = React.useState(false);

  // 根据截止时间自动计算紧急度
  React.useEffect(() => {
    if (formData.deadline && !formData.urgency) {
      const urgency = calcUrgency(new Date(formData.deadline));
      setFormData(prev => ({ ...prev, urgency: urgency.key }));
    }
  }, [formData.deadline]);

  const categoryNames = categories.map(c => c.fields['名称'] || c.fields['分类名称'] || '').filter(Boolean);
  const allCategories = categoryNames.length > 0 ? categoryNames : DEFAULT_CATEGORIES.map(c => c.name);

  const handleSubmit = async () => {
    if (!formData.title.trim()) {
      alert('请输入通知标题');
      return;
    }
    setSubmitting(true);
    try {
      const { appToken, tables } = NOTIFICATION_CONFIG;
      const url = `/bitable/v1/apps/${appToken}/tables/${tables.main}/records`;
      const fields = {
        '标题': formData.title,
        '内容': formData.content,
        '分类': formData.category,
        '紧急程度': formData.urgency,
        '来源': formData.source,
        '状态': '待处理',
        '进度': 0,
      };
      if (formData.deadline) {
        fields['截止时间'] = new Date(formData.deadline).getTime();
      }
      await feishuRequest(url, {
        method: 'POST',
        body: JSON.stringify({ fields })
      });
      if (onSuccess) onSuccess();
    } catch (e) {
      alert('提交失败：' + e.message);
    }
    setSubmitting(false);
  };

  return (
    <div className="notif-modal-overlay" onClick={onClose}>
      <div className="notif-modal" onClick={e => e.stopPropagation()}>
        <div className="notif-modal-header">
          <h3 className="notif-modal-title">📝 快速录入通知</h3>
          <button className="notif-modal-close" onClick={onClose}>×</button>
        </div>
        <div className="notif-modal-body">
          <div className="notif-form-group">
            <label className="notif-form-label">通知标题<span className="required">*</span></label>
            <input
              className="notif-form-input"
              value={formData.title}
              onChange={e => setFormData({...formData, title: e.target.value})}
              placeholder="请输入通知标题"
              autoFocus
            />
          </div>
          <div className="notif-form-group">
            <label className="notif-form-label">通知内容</label>
            <textarea
              className="notif-form-textarea"
              value={formData.content}
              onChange={e => setFormData({...formData, content: e.target.value})}
              placeholder="详细描述通知内容..."
            />
          </div>
          <div className="notif-form-row">
            <div className="notif-form-group">
              <label className="notif-form-label">分类</label>
              <select
                className="notif-form-select"
                value={formData.category}
                onChange={e => setFormData({...formData, category: e.target.value})}
              >
                <option value="">请选择分类</option>
                {allCategories.map(name => (
                  <option key={name} value={name}>{name}</option>
                ))}
              </select>
            </div>
            <div className="notif-form-group">
              <label className="notif-form-label">紧急程度</label>
              <select
                className="notif-form-select"
                value={formData.urgency}
                onChange={e => setFormData({...formData, urgency: e.target.value})}
              >
                <option value="">自动计算</option>
                {URGENCY_LEVELS.map(u => (
                  <option key={u.key} value={u.key}>{u.icon} {u.label}</option>
                ))}
              </select>
            </div>
          </div>
          <div className="notif-form-row">
            <div className="notif-form-group">
              <label className="notif-form-label">截止时间</label>
              <input
                type="datetime-local"
                className="notif-form-input"
                value={formData.deadline}
                onChange={e => setFormData({...formData, deadline: e.target.value})}
              />
            </div>
            <div className="notif-form-group">
              <label className="notif-form-label">来源</label>
              <input
                className="notif-form-input"
                value={formData.source}
                onChange={e => setFormData({...formData, source: e.target.value})}
                placeholder="如：飞书、微信、邮件"
              />
            </div>
          </div>
          <div className="notif-form-group">
            <label className="notif-form-label">附件</label>
            <div style={{
              padding: '20px', border: '2px dashed rgba(255,255,255,0.1)',
              borderRadius: '8px', textAlign: 'center', color: 'var(--text-secondary)',
              fontSize: '13px',
            }}>
              📎 附件上传功能开发中...
            </div>
          </div>
        </div>
        <div className="notif-modal-footer">
          <button className="notif-btn secondary" onClick={onClose}>取消</button>
          <button className="notif-btn primary" onClick={handleSubmit} disabled={submitting}>
            {submitting ? '提交中...' : '提交'}
          </button>
        </div>
      </div>

      {/* 教学任务选择器 */}
      {showWorkPicker && (
        <div className="notif-modal-overlay" onClick={() => setShowWorkPicker(false)}>
          <div className="notif-modal notif-work-picker" onClick={e => e.stopPropagation()}>
            <div className="notif-modal-header">
              <h3 className="notif-modal-title">📚 选择教学任务</h3>
              <button className="notif-modal-close" onClick={() => setShowWorkPicker(false)}>×</button>
            </div>
            <div className="notif-modal-body">
              {teachingWorks.length === 0 ? (
                <div className="notif-empty">暂无教学任务数据</div>
              ) : (
                <div className="notif-work-list">
                  {teachingWorks.map(w => {
                    const title = w.fields['工作标题'] || w.fields['标题'] || '未命名';
                    const status = w.fields['状态'] || '待执行';
                    const deadline = w.fields['截止日期'];
                    const isSelected = formData.teachingWorkId === w.record_id;
                    return (
                      <div
                        key={w.record_id}
                        className={`notif-work-item ${isSelected ? 'selected' : ''}`}
                        onClick={() => {
                          setFormData({...formData, teachingWorkId: w.record_id});
                          setShowWorkPicker(false);
                        }}
                      >
                        <div className="notif-work-item-title">{title}</div>
                        <div className="notif-work-item-meta">
                          {parseDeadline(deadline) ? `截止：${parseDeadline(deadline).toLocaleDateString('zh-CN')}` : '无截止时间'}
                          <span className={`notif-tag ${status === '已完成' ? 'green' : status === '进行中' ? 'blue' : 'yellow'}`}>{status}</span>
                        </div>
                      </div>

              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NotificationDetailDrawer({ notification, tasks, files, reminders, teachingWorks, onClose }) {
  const f = notification.fields;
  const title = f['标题'] || f['通知标题'] || '未命名通知';
  const content = f['内容'] || f['通知内容'] || '';
  const category = f['分类'] || '';
  const dl = f['截止时间'];
  const dlVal = Array.isArray(dl) ? dl[0] : dl;
  const urgency = calcUrgency(dlVal);
  const status = f['状态'] || f['通知状态'] || '待处理';
  const source = f['来源'] || '';
  const progress = Number(f['进度'] || f['任务进度'] || 0);
  const createdAt = notification.created_time || f['创建时间'] || '';
  const updatedAt = notification.last_modified_time || f['最后修改时间'] || '';

  // 关联任务
  const relatedTaskIds = f['关联任务'] || f['任务'] || [];
  const taskIds = Array.isArray(relatedTaskIds) ? relatedTaskIds : (relatedTaskIds ? [relatedTaskIds] : []);
  const relatedTasks = tasks.filter(t => taskIds.includes(t.record_id));

  // 关联教学任务
  const relatedTeachingWorkId = f['关联教学任务'] || '';
  const relatedTeachingWork = teachingWorks && relatedTeachingWorkId
    ? teachingWorks.find(w => w.record_id === relatedTeachingWorkId)
    : null;

  // 进度偏差
  const deviation = calcProgressDeviation(createdAt, dlVal, progress);

  return (
    <>
      <div className="notif-drawer-overlay" onClick={onClose}></div>
      <div className="notif-drawer">
        <div className="notif-drawer-header">
          <div>
            <h3 className="notif-drawer-title">{title}</h3>
            <div className="notif-drawer-tags">
              {category && <span className="notif-tag gray">{category}</span>}
              <span className={`notif-tag ${urgency.color}`}>{urgency.icon} {urgency.label}</span>
              <span className={`notif-tag ${status === '已完成' ? 'green' : status === '已归档' ? 'gray' : status === '进行中' ? 'blue' : 'yellow'}`}>
                {status}
              </span>
            </div>
          </div>
          <button className="notif-drawer-close" onClick={onClose}>×</button>
        </div>
        <div className="notif-drawer-body">
          {/* 基本信息 */}
          <div className="notif-detail-section">
            <div className="notif-detail-section-title">基本信息</div>
            <div className="notif-detail-meta-grid">
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">截止时间</div>
                <div className="notif-detail-meta-value">{dlVal ? notifFormatDate(dlVal) : '未设置'}</div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">倒计时</div>
                <div className="notif-detail-meta-value">{formatCountdown(dlVal)}</div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">任务进度</div>
                <div className="notif-detail-meta-value">{progress}%</div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">进度偏差</div>
                <div className="notif-detail-meta-value" style={{
                  color: deviation.level === 'critical' ? '#ef4444' : deviation.level === 'warning' ? '#eab308' : '#22c55e'
                }}>
                  {deviation.level === 'critical' ? '🔴 告警' : deviation.level === 'warning' ? '🟡 预警' : '🟢 正常'}
                  {' '}({deviation.deviation > 0 ? '+' : ''}{deviation.deviation}%)
                </div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">关联教学任务</div>
                <div className="notif-detail-meta-value">
                  {relatedTeachingWork ? (
                    <span className="notif-teaching-link" onClick={() => {
                      window.location.hash = '/teaching';
                    }}>
                      📚 {relatedTeachingWork.fields['工作标题'] || relatedTeachingWork.fields['标题'] || '未命名'}
                    </span>
                  ) : (
                    <span style={{color:'#6b7280'}}>未关联</span>
                  )}
                </div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">来源</div>
                <div className="notif-detail-meta-value">{source || '未记录'}</div>
              </div>
              <div className="notif-detail-meta-item">
                <div className="notif-detail-meta-label">创建时间</div>
                <div className="notif-detail-meta-value">{createdAt ? new Date(createdAt).toLocaleString('zh-CN') : '未知'}</div>
              </div>
            </div>
          </div>

          {/* 通知内容 */}
          <div className="notif-detail-section">
            <div className="notif-detail-section-title">通知内容</div>
            <div className="notif-detail-content">
              {content || '暂无详细内容'}
            </div>
          </div>

          {/* 关联任务 */}
          <div className="notif-detail-section">
            <div className="notif-detail-section-title">关联任务 ({relatedTasks.length})</div>
            {relatedTasks.length === 0 ? (
              <div style={{color:'var(--text-secondary)', fontSize:'13px'}}>暂无关联任务</div>
            ) : (
              <div className="notif-task-list">
                {relatedTasks.map(t => (
                  <div key={t.record_id} className="notif-task-card">
                    <div className="notif-task-title">{t.fields['任务名称'] || t.fields['标题'] || '未命名任务'}</div>
                    <div className="notif-task-meta">
                      <span>进度 {Number(t.fields['进度'] || 0)}%</span>
                      <span>负责人：{t.fields['负责人'] || '未分配'}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 提醒记录 */}
          <div className="notif-detail-section">
            <div className="notif-detail-section-title">提醒记录</div>
            <div style={{color:'var(--text-secondary)', fontSize:'13px'}}>暂无提醒记录</div>
          </div>

          {/* 操作日志 */}
          <div className="notif-detail-section">
            <div className="notif-detail-section-title">操作日志</div>
            <div style={{color:'var(--text-secondary)', fontSize:'13px'}}>
              {updatedAt ? `最后更新：${new Date(updatedAt).toLocaleString('zh-CN')}` : '暂无更新记录'}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}


function App() {
  const [unlocked, setUnlocked] = useState(isUnlocked());
  const [modules, setModules] = useState(DEFAULT_MODULES);
  const [modulesLoading, setModulesLoading] = useState(true);

  const handleUnlock = () => setUnlocked(true);
  const handleLock = () => setUnlocked(false);

  const loadModules = async () => {
    try {
      setModulesLoading(true);
      const m = await getModules();
      if (m && m.length > 0) {
        setModules(m);
      }
    } catch (err) {
      console.warn('加载模块列表失败，使用默认模块:', err.message);
    } finally {
      setModulesLoading(false);
    }
  };

  useEffect(() => {
    loadModules();
  }, []);

  useEffect(() => {
    const check = () => setUnlocked(isUnlocked());
    window.addEventListener('storage', check);
    return () => window.removeEventListener('storage', check);
  }, []);

  return (
    <div className="app-layout">
      <Sidebar onLock={handleLock} modules={modules} />
      <main className="app-main">
        <Routes>
          <Route path="/" element={<Dashboard modules={modules} />} />
          <Route path="/module-manage" element={
            <ModuleManagePage modules={modules} onModulesChange={loadModules} />
          } />
          {modules.map(m => (
            <Route
              key={m.key}
              path={m.path}
              element={m.path === '/finance' 
                ? <FinancePage />
                : m.path === '/teaching'
                  ? <TeachingPage />
                  : m.path === '/notification'
                    ? <NotificationPage />
                    : m.path === '/daily'
                      ? <DailyPage />
                      : <ModulePage moduleName={m.key} icon={m.icon} color={m.color} modulePath={m.path} moduleHidden={m.hidden} />
              }
            />
          ))}
        </Routes>
      </main>
    </div>
  );
}
