(function(){
  function randomUUID(){
    if(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function"){
      return crypto.randomUUID();
    }
    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){
      return(+c^(crypto.getRandomValues(new Uint8Array(1))[0]&(15>>(+c/4)))).toString(16);
    });
  }

  function encode(obj){return btoa(JSON.stringify(obj))}
  function decode(str){try{return JSON.parse(atob(str))}catch(e){return null}}

  function getDeviceId(){
    var storageKey="__coze_coding_device_info";
    try{
      var info=decode(localStorage.getItem(storageKey));
      if(info&&typeof info.did==="string"){return info.did}
    }catch(e){}
    var newInfo={did:randomUUID()};
    try{localStorage.setItem(storageKey,encode(newInfo))}catch(e){}
    return newInfo.did;
  }

  function sendPageViewEvent(){
    var deviceId=getDeviceId();
    var projectId="7676102851457712174";
    var reportURL="https://code.coze.cn/api/coding/deployment/analytics/report?project_id="+encodeURIComponent(projectId)+"&did="+encodeURIComponent(deviceId);
    try{
      fetch(reportURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          events:[{
            type:"page_view",
            url:window.location.href,
            path:window.location.pathname,
            referrer:document.referrer,
            timestamp:Date.now()
          }]
        })
      }).catch(function(){});
    }catch(e){}
  }

  if(document.readyState==="complete"){
    sendPageViewEvent();
  }else{
    document.addEventListener("readystatechange",function(){
      if(document.readyState==="complete"){sendPageViewEvent()}
    });
  }
})();
</script>

    .notification-sidebar { width: 200px; flex-shrink: 0; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); height: fit-content; }
    .notification-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; cursor: pointer; color: var(--text-secondary, #8b8b9e); font-size: 14px; transition: all 0.2s; margin-bottom: 4px; }

    .notification-content { flex: 1; min-width: 0; }

    /* 总览看板 */
    .notif-overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .notif-stat-card { padding: 20px; border-radius: 12px; position: relative; overflow: hidden; transition: transform 0.2s; }
    .notif-stat-card:hover { transform: translateY(-3px); }
    .notif-stat-pending { background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.03)); border: 1px solid rgba(239,68,68,0.25); }
    .notif-stat-progress { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.03)); border: 1px solid rgba(59,130,246,0.25); }
    .notif-stat-today { background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(245,158,11,0.03)); border: 1px solid rgba(245,158,11,0.25); }
    .notif-stat-archived { background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.03)); border: 1px solid rgba(34,197,94,0.25); }

    .notif-section { margin-bottom: 24px; }
    .notif-section-title { font-size: 15px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .notif-section-title::before { content: ''; width: 3px; height: 16px; background: linear-gradient(180deg, #ef4444, #f59e0b); border-radius: 2px; }

    /* 紧急程度分布 */
    .notif-urgency-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .notif-urgency-item { flex: 1; min-width: 100px; padding: 14px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s; }
    .notif-urgency-item:hover { background: rgba(255,255,255,0.05); }
    .notif-urgency-dot { width: 10px; height: 10px; border-radius: 50%; }
    .notif-urgency-dot.red { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.6); }
    .notif-urgency-dot.orange { background: #f97316; box-shadow: 0 0 8px rgba(249,115,22,0.6); }
    .notif-urgency-dot.yellow { background: #eab308; box-shadow: 0 0 8px rgba(234,179,8,0.6); }
    .notif-urgency-dot.green { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.6); }
    .notif-urgency-dot.blue { background: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,0.6); }
    .notif-urgency-count { font-size: 24px; font-weight: 700; color: var(--text-primary, #e0e0e0); }
    .notif-urgency-label { font-size: 12px; color: var(--text-secondary, #8b8b9e); }

    /* 时间线 */
    .notif-timeline { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .notif-timeline-item { display: flex; gap: 14px; padding: 10px 0; position: relative; }
    .notif-timeline-item:not(:last-child)::after { content: ''; position: absolute; left: 7px; top: 28px; bottom: -4px; width: 1px; background: rgba(255,255,255,0.08); }
    .notif-timeline-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; position: relative; z-index: 1; }
    .notif-timeline-dot.red { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.6); }
    .notif-timeline-dot.orange { background: #f97316; }
    .notif-timeline-dot.yellow { background: #eab308; }
    .notif-timeline-dot.green { background: #22c55e; }
    .notif-timeline-dot.blue { background: #3b82f6; }
    .notif-timeline-content { flex: 1; }
    .notif-timeline-title { font-size: 14px; color: var(--text-primary, #e0e0e0); font-weight: 500; margin-bottom: 4px; }
    .notif-timeline-meta { font-size: 12px; color: var(--text-secondary, #8b8b9e); display: flex; gap: 12px; }

    /* 趋势图 */
    .notif-trend-chart { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); height: 200px; display: flex; align-items: flex-end; justify-content: space-around; gap: 8px; }
    .notif-trend-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .notif-trend-bar-bars { display: flex; gap: 2px; align-items: flex-end; height: 140px; width: 100%; justify-content: center; }
    .notif-trend-bar-add { width: 12px; background: linear-gradient(180deg, #3b82f6, rgba(59,130,246,0.3)); border-radius: 3px 3px 0 0; min-height: 4px; transition: height 0.3s; }
    .notif-trend-bar-done { width: 12px; background: linear-gradient(180deg, #22c55e, rgba(34,197,94,0.3)); border-radius: 3px 3px 0 0; min-height: 4px; transition: height 0.3s; }
    .notif-trend-bar-label { font-size: 11px; color: var(--text-secondary, #8b8b9e); }

    /* 双栏布局 */
    .notif-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* 通知列表 */
    .notif-filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .notif-filter-bar select, .notif-filter-bar input {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary, #e0e0e0);
      padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none;
    }
    .notif-filter-bar select:focus, .notif-filter-bar input:focus { border-color: rgba(239,68,68,0.4); }
    .notif-filter-bar input { flex: 1; min-width: 200px; }

    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-card { background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: all 0.2s; cursor: pointer; display: flex; }
    .notif-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
    .notif-card-urgency { width: 4px; flex-shrink: 0; }
    .notif-card-urgency.red { background: #ef4444; }
    .notif-card-urgency.orange { background: #f97316; }
    .notif-card-urgency.yellow { background: #eab308; }
    .notif-card-urgency.green { background: #22c55e; }
    .notif-card-urgency.blue { background: #3b82f6; }
    .notif-card-body { flex: 1; padding: 14px 16px; }
    .notif-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .notif-card-title { font-size: 15px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin: 0 0 6px 0; }
    .notif-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .notif-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .notif-tag.red { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .notif-tag.orange { background: rgba(249,115,22,0.15); color: #fdba74; }
    .notif-tag.yellow { background: rgba(234,179,8,0.15); color: #fde047; }
    .notif-tag.green { background: rgba(34,197,94,0.15); color: #86efac; }
    .notif-tag.blue { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .notif-tag.gray { background: rgba(156,163,175,0.15); color: #cbd5e1; }
    .notif-card-deadline { font-size: 12px; color: var(--text-secondary, #8b8b9e); margin-bottom: 8px; }
    .notif-card-progress { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .notif-card-progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; transition: width 0.3s; }
    .notif-card-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary, #8b8b9e); }
    .notif-card-actions { display: flex; gap: 8px; }
    .notif-card-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none;
      background: rgba(255,255,255,0.08); color: var(--text-secondary, #8b8b9e); transition: all 0.2s;
    }
    .notif-card-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary, #e0e0e0); }
    .notif-card-btn.primary { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .notif-card-btn.primary:hover { background: rgba(239,68,68,0.3); }

    /* 浮动按钮 */
    .notif-fab {
      position: fixed; right: 32px; bottom: 32px; width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #ef4444, #f97316); color: white; font-size: 24px;
      border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .notif-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(239,68,68,0.5); }

    /* 弹窗 */
    .notif-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 200;
      animation: fadeIn 0.2s ease;
    }
    .notif-modal {
      background: #1a1a2e; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      width: 560px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
      animation: modalIn 0.3s ease;
    }
    .notif-modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .notif-modal-title { font-size: 18px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin: 0; }
    .notif-modal-close { background: none; border: none; color: var(--text-secondary, #8b8b9e); font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .notif-modal-close:hover { color: var(--text-primary, #e0e0e0); }
    .notif-modal-body { padding: 20px 24px; }
    .notif-modal-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: flex-end; gap: 10px; }
    .notif-form-group { margin-bottom: 16px; }
    .notif-form-label { display: block; font-size: 13px; color: var(--text-secondary, #8b8b9e); margin-bottom: 6px; }
    .notif-form-label .required { color: #ef4444; margin-left: 2px; }
    .notif-form-input, .notif-form-select, .notif-form-textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-primary, #e0e0e0); padding: 10px 12px; border-radius: 8px; font-size: 14px;
      outline: none; box-sizing: border-box; font-family: inherit;
    }
    .notif-form-input:focus, .notif-form-select:focus, .notif-form-textarea:focus { border-color: rgba(239,68,68,0.4); }
    .notif-form-textarea { min-height: 100px; resize: vertical; }
    .notif-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .notif-btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; font-weight: 500; }
    .notif-btn.primary { background: linear-gradient(135deg, #ef4444, #f97316); color: white; }
    .notif-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
    .notif-btn.secondary { background: rgba(255,255,255,0.08); color: var(--text-secondary, #8b8b9e); }
    .notif-btn.secondary:hover { background: rgba(255,255,255,0.12); color: var(--text-primary, #e0e0e0); }
    .notif-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 任务分组 */
    .notif-task-group { margin-bottom: 24px; }
    .notif-task-group-title { font-size: 15px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .notif-task-group-count { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
    .notif-task-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-task-card { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all 0.2s; }
    .notif-task-card:hover { background: rgba(255,255,255,0.05); }
    .notif-task-title { font-size: 14px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin-bottom: 6px; }
    .notif-task-meta { font-size: 12px; color: var(--text-secondary, #8b8b9e); display: flex; gap: 14px; margin-bottom: 8px; }
    .notif-task-progress { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
    .notif-task-progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 2px; }

    /* 分类配置 */
    .notif-category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .notif-category-card { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); transition: all 0.2s; }
    .notif-category-card:hover { background: rgba(255,255,255,0.05); }
    .notif-category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .notif-category-icon { font-size: 24px; }
    .notif-category-name { font-size: 15px; font-weight: 600; color: var(--text-primary, #e0e0e0); }
    .notif-category-desc { font-size: 12px; color: var(--text-secondary, #8b8b9e); margin-bottom: 10px; line-height: 1.5; }
    .notif-category-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .notif-category-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
    .notif-category-action-btn { flex: 1; padding: 6px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; background: rgba(255,255,255,0.06); color: var(--text-secondary, #8b8b9e); transition: all 0.2s; }
    .notif-category-action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary, #e0e0e0); }
    .notif-category-action-btn.danger:hover { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .notif-add-category-btn { border: 2px dashed rgba(255,255,255,0.15); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; cursor: pointer; color: var(--text-secondary, #8b8b9e); border-radius: 10px; transition: all 0.2s; }
    .notif-add-category-btn:hover { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .notif-add-icon { font-size: 28px; margin-bottom: 8px; }
    .notif-add-text { font-size: 13px; }

    /* 详情抽屉 */
    .notif-drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; animation: fadeIn 0.2s ease; }
    .notif-drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 500px; max-width: 90vw; background: #1a1a2e; border-left: 1px solid rgba(255,255,255,0.1); z-index: 151; overflow-y: auto; animation: slideInRight 0.3s ease; }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .notif-drawer-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: flex-start; }
    .notif-drawer-title { font-size: 18px; font-weight: 600; color: var(--text-primary, #e0e0e0); margin: 0 0 8px 0; }
    .notif-drawer-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .notif-drawer-close { background: none; border: none; color: var(--text-secondary, #8b8b9e); font-size: 20px; cursor: pointer; }
    .notif-drawer-body { padding: 20px 24px; }
    .notif-detail-section { margin-bottom: 20px; }
    .notif-detail-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary, #8b8b9e); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .notif-detail-content { font-size: 14px; color: var(--text-primary, #e0e0e0); line-height: 1.7; white-space: pre-wrap; }
    .notif-detail-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .notif-detail-meta-item { background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 8px; }
    .notif-detail-meta-label { font-size: 11px; color: var(--text-secondary, #8b8b9e); margin-bottom: 4px; }
    .notif-detail-meta-value { font-size: 13px; color: var(--text-primary, #e0e0e0); font-weight: 500; }

    .notif-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary, #8b8b9e); }
    .notif-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .notif-empty-text { font-size: 14px; }
    .notif-loading { text-align: center; padding: 60px; color: var(--text-secondary, #8b8b9e); }
    .notif-spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #ef4444; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        /* 教学任务关联相关 */

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error.toString() };
  }
  componentDidCatch(error, info) {
    console.error("ErrorBoundary:", error, info);
    this.setState({ info: info.componentStack || '' });
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{padding:'40px',color:'#ff6b6b',background:'#1a1a2e',minHeight:'100vh',fontFamily:'sans-serif'}}>
          <h2>渲染错误</h2>
          <pre style={{background:'#000',padding:'20px',borderRadius:'8px',overflow:'auto',whiteSpace:'pre-wrap',fontSize:'12px'}}>{this.state.error + '\n\n--- Stack ---\n' + (this.state.info || '')}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

const { useState, useEffect, useMemo, useRef } = React;
// 极简 hash 路由实现
function useHashRoute() {
  const getCleanPath = () => {
    const raw = window.location.hash.slice(1) || '/';
    // 去掉 query string，只保留路径部分用于路由匹配
    const qIndex = raw.indexOf('?');
    return qIndex === -1 ? raw : raw.substring(0, qIndex);
  };
  const [hash, setHash] = React.useState(getCleanPath());
  React.useEffect(() => {
    const handler = () => setHash(getCleanPath());
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  const navigate = (path) => { window.location.hash = path; };
  return { path: hash, navigate };
}

function NavLink({ to, children, className, activeClassName }) {
  const { path } = useHashRoute();
  const isActive = path === to || (to !== '/' && path.startsWith(to));
  const cls = (className || '') + (isActive ? ' ' + (activeClassName || 'active') : '');
  return <a href={'#' + to} className={cls}>{children}</a>;
}

function Link({ to, children, className }) {
  return <a href={'#' + to} className={className}>{children}</a>;
}
function Routes({ children }) {
  const { path } = useHashRoute();
  let matched = null;
  React.Children.forEach(children, child => {
    if (!matched && child.props.path === path) matched = child;
  });
  // fallback to first route if no match
  if (!matched && React.Children.count(children) > 0) {
    matched = React.Children.toArray(children).find(c => c.props.path === '/') || React.Children.toArray(children)[0];
  }
  return matched ? matched.props.element : null;
}
function Route({ path, element }) { return null; }

// 日期工具
function formatDate(dateInput) {
  if (!dateInput) return '-';
  let d;
  if (Array.isArray(dateInput)) d = new Date(dateInput[0]);
  else if (typeof dateInput === 'number') d = new Date(dateInput);
  else d = new Date(dateInput);
  if (isNaN(d.getTime())) return '-';
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function getDueStatus(dateInput, status) {
  if (!dateInput || status === '已完成' || status === '归档') return 'normal';
  let d;
  if (Array.isArray(dateInput)) d = new Date(dateInput[0]);
  else if (typeof dateInput === 'number') d = new Date(dateInput);
  else d = new Date(dateInput);
  if (isNaN(d.getTime())) return 'normal';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  d.setHours(0, 0, 0, 0);
  if (d < today) return 'overdue';
  if (d.getTime() === today.getTime()) return 'today';
  const diff = (d - today) / (1000 * 60 * 60 * 24);
  if (diff <= 3) return 'near';
  return 'normal';
}

function makeVersionEntry(action) {
  return `${new Date().toLocaleString('zh-CN')} - ${action}\n`;
}

function parseVersionHistory(text) {
  if (!text) return [];
  return text.split('\n').filter(line => line.trim()).map(line => {
    const match = line.match(/^(.+?)\s*-\s*(.+)$/);
    if (match) return { time: match[1].trim(), action: match[2].trim() };
    return { time: '', action: line.trim() };
  });
}

// 飞书单选字段取值工具函数
// 飞书单选字段返回对象数组 [{text: "值"}] 或 [{name: "值"}]，多选同理
// 该函数统一处理：字符串直接返回，数组取第一个元素的 text/name，其他返回空字符串
function getFieldValue(fieldValue) {
  if (fieldValue === null || fieldValue === undefined) return '';
  if (typeof fieldValue === 'string') return fieldValue;
  if (typeof fieldValue === 'number') return fieldValue; // 数字类型（如datetime毫秒时间戳）
  if (typeof fieldValue === 'boolean') return fieldValue;
  if (Array.isArray(fieldValue)) {
    const first = fieldValue[0];
    if (first === null || first === undefined) return '';
    if (typeof first === 'string') return first;
    if (typeof first === 'number') return first;
    return first.text || first.name || '';
  }
  return '';
}

function calcStatusStats(records) {
  const stats = {
    total: records.length, todo: 0, doing: 0, done: 0,
    onHold: 0, archived: 0, overdue: 0, todayDue: 0, nearDue: 0,
  };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const threeDaysLater = new Date(today);
  threeDaysLater.setDate(today.getDate() + 3);

  records.forEach(r => {
    const status = getFieldValue(r.fields['任务状态']);
    const dueText = r.fields['截止时间'];
    let dueDate = null;
    if (dueText) {
      const ts = Array.isArray(dueText) ? dueText[0] : dueText;
      if (typeof ts === 'number') dueDate = new Date(ts);
    }
    switch (status) {
      case '待执行': stats.todo++; break;
      case '进行中': stats.doing++; break;
      case '已完成': stats.done++; break;
      case '搁置': stats.onHold++; break;
      case '归档': stats.archived++; break;
    }
    if (dueDate && status !== '已完成' && status !== '归档') {
      const d = new Date(dueDate);
      d.setHours(0, 0, 0, 0);
      if (d < today) stats.overdue++;
      else if (d.getTime() === today.getTime()) stats.todayDue++;
      else if (d <= threeDaysLater) stats.nearDue++;
    }
  });
  const activeTotal = stats.todo + stats.doing + stats.done + stats.onHold;
  stats.completionRate = activeTotal > 0 ? Math.round((stats.done / activeTotal) * 100) : 0;
  return stats;
}

function groupByModule(records) {
  const groups = {};
  records.forEach(r => {
    const module = getRecordModule(r);
    if (!groups[module]) groups[module] = [];
    groups[module].push(r);
  });
  return groups;
}

async function proxyFetch(targetUrl, options = {}) {
  // 将飞书地址转换为代理地址
  // 原地址：https://open.feishu.cn/open-apis/bitable/v1/...
  // 目标：https://d78rws3qxj.coze.site/api/feishu/bitable/v1/...
  const feishuPath = targetUrl.replace('https://open.feishu.cn/open-apis', '');
  const url = FEISHU_PROXY + feishuPath;
  
  // 写操作（POST/PUT/DELETE）只重试 1 次，避免重复执行；GET 请求重试 3 次
  const method = (options.method || 'GET').toUpperCase();
  const isWriteOp = ['POST', 'PUT', 'DELETE', 'PATCH'].includes(method);
  const maxRetries = isWriteOp ? 1 : 3;
  
  let lastError = null;
  for (let i = 0; i < maxRetries; i++) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时
      const res = await fetch(url, {
        ...options,
        signal: controller.signal,
      });
      clearTimeout(timeoutId);
      return res;
    } catch (e) {
      lastError = e;
      const errorType = e.name === 'AbortError' ? '超时' : '网络错误';
      console.warn(`代理请求第 ${i+1}/${maxRetries} 次失败 (${errorType}):`, e.message, 'URL:', url);
      
      // 写操作失败时不重试，直接抛出
      if (isWriteOp) {
        const hint = e.name === 'AbortError' 
          ? '请求超时，请检查网络连接后重试' 
          : '网络请求失败，请检查网络连接或稍后重试';
        throw new Error(`${hint} (${e.message || errorType})`);
      }
      
      // GET 请求才进行重试
      if (i < maxRetries - 1) {
        await new Promise(r => setTimeout(r, 500 * (i + 1))); // 递增等待
      }
    }
  }
  
  // GET 请求所有重试都失败
  const errorType = lastError?.name === 'AbortError' ? '请求超时' : '网络请求失败';
  throw new Error(`${errorType}，请检查网络连接后重试 (${lastError?.message || '未知错误'})`);
}

    throw new Error(data.msg || '飞书 API 请求失败');
  }
  return data.data;
}

// 统一清洗飞书字段：将所有富文本数组转成纯文本字符串
// 避免组件层漏调用 getFieldValue 导致 React #31 渲染错误
function cleanFields(fields) {
  const cleaned = {};
  for (const key in fields) {
    const val = fields[key];
    // 多选字段：元素是字符串，保留数组
    if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'string') {
      cleaned[key] = val;
    }
    // 其他情况（富文本对象数组、纯字符串、数字等）统一走 getFieldValue
    else {
      cleaned[key] = getFieldValue(val);
    }
  }
  return cleaned;
}

async function searchRecordsByTable(appToken, tableId) {
  const allItems = [];
  let pageToken = '';
  let hasMore = true;

  while (hasMore) {
    const url = `/bitable/v1/apps/${appToken}/tables/${tableId}/records/search`;
    const body = { page_size: 500 };
    if (pageToken) body.page_token = pageToken;

    const data = await feishuRequest(url, { method: 'POST', body: JSON.stringify(body) });
    allItems.push(...(data.items || []));
    hasMore = data.has_more;
    pageToken = data.page_token || '';
  }

  return allItems.map(item => ({ ...item, fields: cleanFields(item.fields) }));
}

function ChangeLockPasswordModal({ onSuccess, onClose }) {
  const [oldPwd, setOldPwd] = useState('');
  const [newPwd, setNewPwd] = useState('');
  const [confirmPwd, setConfirmPwd] = useState('');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) inputRef.current.focus();
  }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    setError('');
    if (!checkLockPassword(oldPwd)) {
      setError('旧密码错误');
      return;
    }
    if (newPwd !== confirmPwd) {
      setError('两次输入的新密码不一致');
      return;
    }
    if (!newPwd) {
      setError('新密码不能为空');
      return;
    }
    setLockPassword(newPwd);
    setSuccess(true);
    setTimeout(() => {
      if (onSuccess) onSuccess();
    }, 800);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content password-modal module-lock-modal" onClick={e => e.stopPropagation()}>
        <div className="password-icon">🔐</div>
        <h2 className="password-title">修改解锁密码</h2>
        <p className="password-desc">修改所有模块共用的解锁密码</p>
        <form onSubmit={handleSubmit}>
          <div style={{ marginBottom: '12px' }}>
            <input
              ref={inputRef}
              type="password"
              value={oldPwd}
              onChange={e => { setOldPwd(e.target.value); setError(''); }}
              placeholder="旧密码"
              className="password-input"
              autoComplete="off"
            />
          </div>
          <div style={{ marginBottom: '12px' }}>
            <input
              type="password"
              value={newPwd}
              onChange={e => { setNewPwd(e.target.value); setError(''); }}
              placeholder="新密码"
              className="password-input"
              autoComplete="off"
            />
          </div>
          <div style={{ marginBottom: '4px' }}>
            <input
              type="password"
              value={confirmPwd}
              onChange={e => { setConfirmPwd(e.target.value); setError(''); }}
              placeholder="确认新密码"
              className="password-input"
              autoComplete="off"
            />
          </div>
          {error && <div className="password-error">{error}</div>}
          {success && <div style={{ color: 'var(--accent-green)', fontSize: '13px', marginTop: '8px' }}>密码修改成功</div>}
          <div className="modal-btns" style={{ marginTop: '20px' }}>
            <button type="button" className="btn btn-secondary" onClick={onClose}>取消</button>
            <button type="submit" className="btn btn-primary" disabled={success}>确认修改</button>
          </div>
        </form>
      </div>
    </div>
  );
}

  const overviewData = {

    monthIncome: monthStats.income + salaryIncome,
    monthExpense: monthStats.expense,
    monthBalance: monthStats.income + salaryIncome - monthStats.expense,
  };

  // 支出分类饼图
  const expenseByCategory = React.useMemo(() => {
    const map = {};
    data.ledger.forEach(r => {
      if (r.fields['收支类型'] !== '支出') return;
      if (!r.fields['记录日期']) return;
      const d = new Date(r.fields['记录日期']);
      const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (ym !== curMonth) return;
      const cat = r.fields['分类'] || '其他';
      map[cat] = (map[cat] || 0) + (Number(r.fields['金额']) || 0);
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [data.ledger, curMonth]);

  const incomeByCategory = React.useMemo(() => {
    const map = {};
    data.ledger.forEach(r => {
      if (r.fields['收支类型'] !== '收入') return;
      if (!r.fields['记录日期']) return;
      const d = new Date(r.fields['记录日期']);
      const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (ym !== curMonth) return;
      const cat = r.fields['分类'] || '其他';
      map[cat] = (map[cat] || 0) + (Number(r.fields['金额']) || 0);
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [data.ledger, curMonth]);

  // 饼图颜色
  const pieColors = ['#f5c842', '#f87171', '#60a5fa', '#4ade80', '#c084fc', '#fb923c', '#38bdf8', '#a78bfa', '#fbbf24', '#4b5563'];
  const makePieGradient = (dataArr) => {
    const total = dataArr.reduce((s, [, v]) => s + v, 0);
    if (total === 0) return 'rgba(255,255,255,0.05)';
    let parts = [];
    let acc = 0;
    dataArr.forEach(([k, v], i) => {
      const pct = (v / total) * 100;
      const color = pieColors[i % pieColors.length];
      parts.push(`${color} ${acc}% ${acc + pct}%`);
      acc += pct;
    });
    return `conic-gradient(${parts.join(', ')})`;
  };

  // 近期提醒
  const upcomingReminders = React.useMemo(() => {
    return data.reminders
      .filter(r => r.fields['状态'] === '启用')
      .sort((a, b) => (a.fields['下次提醒日期'] || 0) - (b.fields['下次提醒日期'] || 0))
      .slice(0, 5);
  }, [data.reminders]);

  // 进行中的贷款
  const activeLoans = React.useMemo(() => {
    return data.loans.filter(l => l.fields['状态'] === '正常' || l.fields['状态'] === '逾期');
  }, [data.loans]);

  // ========== 记账过滤 & 分组 ==========
  const filteredLedger = React.useMemo(() => {
    return data.ledger.filter(r => {
      if (ledgerFilter !== 'all' && r.fields['收支类型'] !== 
          (ledgerFilter === 'income' ? '收入' : ledgerFilter === 'expense' ? '支出' : '转账')) return false;
      if (r.fields['记录日期']) {
        const d = new Date(r.fields['记录日期']);
        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (ym !== ledgerMonth) return false;
      }
      return true;
    }).sort((a, b) => (b.fields['记录日期'] || 0) - (a.fields['记录日期'] || 0));
  }, [data.ledger, ledgerFilter, ledgerMonth]);

  const groupedLedger = React.useMemo(() => {
    const groups = {};
    filteredLedger.forEach(r => {
      const date = r.fields['记录日期'] ? formatDate(r.fields['记录日期']) : '未知日期';
      if (!groups[date]) groups[date] = [];
      groups[date].push(r);
    });
    return groups;
  }, [filteredLedger]);

  const ledgerMonthStats = React.useMemo(() => {
    const stats = { income: 0, expense: 0 };
    data.ledger.forEach(r => {
      if (!r.fields['记录日期']) return;
      const d = new Date(r.fields['记录日期']);
      const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (ym !== ledgerMonth) return;
      const amount = Number(r.fields['金额']) || 0;
      const type = r.fields['收支类型'];
      if (type === '收入') stats.income += amount;
      else if (type === '支出') stats.expense += amount;
    });
    stats.balance = stats.income - stats.expense;
    return stats;
  }, [data.ledger, ledgerMonth]);

  // ========== 资产库过滤 ==========
  const filteredAssets = React.useMemo(() => {
    return data.assets.filter(r => {
      if (assetFilter !== 'all' && r.fields['分类'] !== assetFilter) return false;
      if (assetStatusFilter !== 'all' && r.fields['状态'] !== assetStatusFilter) return false;
      return true;
    });
  }, [data.assets, assetFilter, assetStatusFilter]);

  const assetStats = React.useMemo(() => {
    let totalCost = 0, totalValue = 0;
    data.assets.forEach(r => {
      totalCost += Number(r.fields['购入价格']) || 0;
      totalValue += Number(r.fields['当前估值']) || 0;
    });
    return { totalCost, totalValue, profit: totalValue - totalCost };
  }, [data.assets]);

  // ========== 收入过滤 ==========
  const filteredIncome = React.useMemo(() => {
    return data.income.filter(r => {
      if (incomeTypeFilter !== 'all' && r.fields['收入类型'] !== incomeTypeFilter) return false;
      if (r.fields['到账日期']) {
        const d = new Date(r.fields['到账日期']);
        if (d.getFullYear() !== incomeYear) return false;
      }
      return true;
    }).sort((a, b) => (b.fields['到账日期'] || 0) - (a.fields['到账日期'] || 0));
  }, [data.income, incomeTypeFilter, incomeYear]);

  const incomeStats = React.useMemo(() => {
    let yearTotal = 0, monthTotal = 0, count = 0;
    const curM = new Date().getMonth();
    const curY = new Date().getFullYear();
    data.income.forEach(r => {
      const amount = Number(r.fields['金额']) || 0;
      if (r.fields['到账日期']) {
        const d = new Date(r.fields['到账日期']);
        if (d.getFullYear() === incomeYear) { yearTotal += amount; count++; }
        if (d.getFullYear() === curY && d.getMonth() === curM) monthTotal += amount;
      }
    });
    return { yearTotal, monthTotal, avgMonth: count > 0 ? Math.round(yearTotal / 12) : 0 };
  }, [data.income, incomeYear]);

  const groupedIncome = React.useMemo(() => {
    const groups = {};
    filteredIncome.forEach(r => {
      const d = r.fields['到账日期'] ? new Date(r.fields['到账日期']) : null;
      const key = d ? `${d.getFullYear()}年${d.getMonth() + 1}月` : '未设置日期';
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    return groups;
  }, [filteredIncome]);

  // ========== 贷负过滤 ==========
  const filteredLoans = React.useMemo(() => {
    return data.loans.filter(r => {
      if (loanStatusFilter !== 'all' && r.fields['状态'] !== loanStatusFilter) return false;
      return true;
    });
  }, [data.loans, loanStatusFilter]);

  const loanStats = React.useMemo(() => {
    let total = 0, paid = 0, remain = 0, monthly = 0;
    data.loans.forEach(r => {
      total += Number(r.fields['贷款总额']) || 0;
      paid += Number(r.fields['已还本金']) || 0;
      remain += Math.max(0, (Number(r.fields['贷款总额']) || 0) - (Number(r.fields['已还本金']) || 0));
      if (r.fields['状态'] === '正常' || r.fields['状态'] === '逾期') {
        monthly += Number(r.fields['月还款额']) || 0;
      }
    });
    return { total, paid, remain, monthly };
  }, [data.loans]);

  // ========== 提醒过滤 ==========
  const filteredReminders = React.useMemo(() => {
    return data.reminders.filter(r => {
      if (reminderTypeFilter !== 'all' && r.fields['提醒类型'] !== reminderTypeFilter) return false;
      if (reminderStatusFilter !== 'all' && r.fields['状态'] !== reminderStatusFilter) return false;
      return true;
    }).sort((a, b) => (a.fields['下次提醒日期'] || 0) - (b.fields['下次提醒日期'] || 0));
  }, [data.reminders, reminderTypeFilter, reminderStatusFilter]);

  const reminderStats = React.useMemo(() => {
    const now = Date.now();
    const soon = now + 7 * 24 * 3600 * 1000;
    let upcoming = 0, overdue = 0, total = data.reminders.length;
    data.reminders.forEach(r => {
      if (r.fields['状态'] !== '启用') return;
      const t = r.fields['下次提醒日期'] || 0;
      if (t < now) overdue++;
      else if (t <= soon) upcoming++;
    });
    return { upcoming, overdue, total };
  }, [data.reminders]);

  // ========== 通用 CRUD ==========
  const handleCreate = async (tableKey, fields) => {
    setSubmitting(true);
    try {
      await createRecordByTable(FINANCE_CONFIG.appToken, FINANCE_CONFIG.tables[tableKey], fields);
      await loadData();
    } catch (e) {
      alert('操作失败：' + (e.message || '未知错误'));
    }
    setSubmitting(false);
  };

  const handleUpdate = async (tableKey, recordId, fields) => {
    setSubmitting(true);
    try {
      await updateRecordByTable(FINANCE_CONFIG.appToken, FINANCE_CONFIG.tables[tableKey], recordId, fields);
      await loadData();
    } catch (e) {
      alert('操作失败：' + (e.message || '未知错误'));
    }
    setSubmitting(false);
  };

  const handleDelete = async (tableKey, recordId) => {
    if (!confirm('确定要删除这条记录吗？')) return;
    try {
      await deleteRecordByTable(FINANCE_CONFIG.appToken, FINANCE_CONFIG.tables[tableKey], recordId);
      await loadData();
    } catch (e) {
      alert('删除失败：' + (e.message || '未知错误'));
    }
  };

  // ========== 记账表单 ==========
  const openLedgerModal = (record = null) => {
    setEditingLedger(record);
    setShowLedgerModal(true);
  };

  const submitLedger = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = {
      '记录日期': fd.get('记录日期') ? new Date(fd.get('记录日期')).getTime() : Date.now(),
      '收支类型': fd.get('收支类型'),
      '金额': Number(fd.get('金额')) || 0,
      '分类': fd.get('分类') || '',
      '关联账户': fd.get('关联账户') || '',
      '备注': fd.get('备注') || '',
      '关联贷款': fd.get('关联贷款') || '',
      '关联资产': fd.get('关联资产') || '',
    };
    if (editingLedger) {
      handleUpdate('ledger', editingLedger.record_id, fields);
    } else {
      handleCreate('ledger', fields);
    }
    setShowLedgerModal(false);
    setEditingLedger(null);
  };

  // ========== 资产表单 ==========
  const openAssetModal = (record = null) => {
    setEditingAsset(record);
    setShowAssetModal(true);
  };

  const submitAsset = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = {
      '物品名称': fd.get('物品名称') || '',
      '分类': fd.get('分类') || '',
      '购入价格': Number(fd.get('购入价格')) || 0,
      '购入日期': fd.get('购入日期') ? new Date(fd.get('购入日期')).getTime() : Date.now(),
      '当前估值': Number(fd.get('当前估值')) || 0,
      '状态': fd.get('状态') || '在用',
      '折旧年限': Number(fd.get('折旧年限')) || 0,
      '购买渠道': fd.get('购买渠道') || '',
      '备注': fd.get('备注') || '',
    };
    if (editingAsset) {
      handleUpdate('assets', editingAsset.record_id, fields);
    } else {
      handleCreate('assets', fields);
    }
    setShowAssetModal(false);
    setEditingAsset(null);
  };

  // ========== 收入表单 ==========
  const openIncomeModal = (record = null) => {
    setEditingIncome(record);
    setShowIncomeModal(true);
  };

  const submitIncome = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = {
      '收入名称': fd.get('收入名称') || '',
      '收入类型': fd.get('收入类型') || '',
      '金额': Number(fd.get('金额')) || 0,
      '到账日期': fd.get('到账日期') ? new Date(fd.get('到账日期')).getTime() : Date.now(),
      '来源': fd.get('来源') || '',
      '是否计入记账': fd.get('是否计入记账') || '是',
      '备注': fd.get('备注') || '',
    };
    if (editingIncome) {
      handleUpdate('income', editingIncome.record_id, fields);
    } else {
      handleCreate('income', fields);
    }
    setShowIncomeModal(false);
    setEditingIncome(null);
  };

  // ========== 贷款表单 ==========
  const openLoanModal = (record = null) => {
    setEditingLoan(record);
    setShowLoanModal(true);
  };

  const submitLoan = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = {
      '贷款名称': fd.get('贷款名称') || '',
      '类型': fd.get('类型') || '',
      '贷款总额': Number(fd.get('贷款总额')) || 0,
      '已还本金': Number(fd.get('已还本金')) || 0,
      '年利率': Number(fd.get('年利率')) || 0,
      '月还款额': Number(fd.get('月还款额')) || 0,
      '总期数': Number(fd.get('总期数')) || 0,
      '已还期数': Number(fd.get('已还期数')) || 0,
      '放款日期': fd.get('放款日期') ? new Date(fd.get('放款日期')).getTime() : Date.now(),
      '还款日': Number(fd.get('还款日')) || 1,
      '还款账户': fd.get('还款账户') || '',
      '状态': fd.get('状态') || '正常',
      '备注': fd.get('备注') || '',
    };
    if (editingLoan) {
      handleUpdate('loans', editingLoan.record_id, fields);
    } else {
      handleCreate('loans', fields);
    }
    setShowLoanModal(false);
    setEditingLoan(null);
  };

  // ========== 提醒表单 ==========
  const openReminderModal = (record = null) => {
    setEditingReminder(record);
    setShowReminderModal(true);
  };

  const submitReminder = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = {
      '提醒标题': fd.get('提醒标题') || '',
      '提醒类型': fd.get('提醒类型') || '',
      '金额': Number(fd.get('金额')) || 0,
      '下次提醒日期': fd.get('下次提醒日期') ? new Date(fd.get('下次提醒日期')).getTime() : Date.now(),
      '重复周期': fd.get('重复周期') || '不重复',
      '关联贷款': fd.get('关联贷款') || '',
      '状态': fd.get('状态') || '启用',
      '备注': fd.get('备注') || '',
    };
    if (editingReminder) {
      handleUpdate('reminders', editingReminder.record_id, fields);
    } else {
      handleCreate('reminders', fields);
    }
    setShowReminderModal(false);
    setEditingReminder(null);
  };

  const markReminderDone = async (record) => {
    const fields = { ...record.fields, '状态': '已完成' };
    handleUpdate('reminders', record.record_id, fields);
  };

  // ========== 工具函数 ==========
  const fmtMoney = (n) => {
    const num = Number(n) || 0;
    return (num >= 0 ? '' : '-') + '¥' + Math.abs(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  const fmtShortMoney = (n) => {
    const num = Number(n) || 0;
    const abs = Math.abs(num);
    if (abs >= 10000) return (num / 10000).toFixed(1) + '万';
    if (abs >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num.toFixed(0);
  };

  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };

  const fieldToDateStr = (val) => {
    if (!val) return '';
    const d = new Date(val);
    if (isNaN(d)) return '';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };

  const isReminderUrgent = (record) => {
    if (record.fields['状态'] !== '启用') return false;
    const t = record.fields['下次提醒日期'] || 0;
    return t < Date.now() || t - Date.now() < 7 * 24 * 3600 * 1000;
  };

  // ========== 渲染 ==========
  if (loading) {
    return (
      <div className="finance-page">
        <div className="finance-loading">加载中...</div>
      </div>
    );
  }

  if (error) {
    return (
      <div className="finance-page">
        <div style={{padding:'40px', textAlign:'center', color:'#f87171'}}>
          {error}
          <div style={{marginTop:'16px'}}>
            <button className="finance-btn primary" onClick={loadData}>重试</button>
          </div>
        </div>
      </div>
    );
  }

  const tabs = [
    { key: 'overview', label: '总览', icon: '📊' },
    { key: 'ledger', label: '记账', icon: '📝' },
    { key: 'assets', label: '资产库', icon: '📦' },
    { key: 'income', label: '收入', icon: '💰' },
    { key: 'loans', label: '贷负', icon: '🏦' },
    { key: 'reminders', label: '提醒', icon: '🔔' },
  ];

  return (
    <div className="finance-page">
      {/* Tabs */}
      <div className="finance-tabs">
        {tabs.map(t => (
          <div
            key={t.key}
            className={'finance-tab' + (activeTab === t.key ? ' active' : '')}
            onClick={() => setActiveTab(t.key)}
          >
            <span style={{marginRight:'6px'}}>{t.icon}</span>{t.label}
          </div>
        ))}
      </div>

      <div className="finance-content">
        {/* ========== 总览分区 ========== */}
        {activeTab === 'overview' && (
          <div>
            <div className="overview-grid">
              <div className="stat-card stat-net">
                <div className="stat-label">净资产</div>
                <div className="stat-value">{fmtMoney(overviewData.netAssets)}</div>
                <div className="stat-sub">资产估值 - 剩余贷款</div>
              </div>
              <div className="stat-card stat-income">
                <div className="stat-label">本月收入</div>
                <div className="stat-value">{fmtMoney(overviewData.monthIncome)}</div>
                <div className="stat-sub">含计入记账的工资收入</div>
              </div>
              <div className="stat-card stat-expense">
                <div className="stat-label">本月支出</div>
                <div className="stat-value">{fmtMoney(overviewData.monthExpense)}</div>
                <div className="stat-sub">所有支出类记录</div>
              </div>
              <div className="stat-card stat-balance">
                <div className="stat-label">本月结余</div>
                <div className="stat-value">{fmtMoney(overviewData.monthBalance)}</div>
                <div className="stat-sub" style={{color: overviewData.monthBalance >= 0 ? '#4ade80' : '#f87171'}}>
                  {overviewData.monthBalance >= 0 ? '正现金流 ✓' : '赤字 ⚠'}
                </div>
              </div>
            </div>

            <div className="chart-section">
              <div className="chart-card">
                <div className="chart-title">本月支出构成</div>
                {expenseByCategory.length === 0 ? (
                  <div className="chart-empty">暂无支出记录</div>
                ) : (
                  <div className="pie-chart-wrap">
                    <div className="pie-chart" style={{background: makePieGradient(expenseByCategory)}}></div>
                    <div className="pie-legend">
                      {expenseByCategory.slice(0, 6).map(([k, v], i) => (
                        <div key={k} className="pie-legend-item">
                          <span className="pie-legend-dot" style={{background: pieColors[i % pieColors.length]}}></span>
                          <span>{k}</span>
                          <span className="pie-legend-value">{fmtShortMoney(v)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              <div className="chart-card">
                <div className="chart-title">本月收入构成</div>
                {incomeByCategory.length === 0 ? (
                  <div className="chart-empty">暂无收入记录</div>
                ) : (
                  <div className="pie-chart-wrap">
                    <div className="pie-chart" style={{background: makePieGradient(incomeByCategory)}}></div>
                    <div className="pie-legend">
                      {incomeByCategory.slice(0, 6).map(([k, v], i) => (
                        <div key={k} className="pie-legend-item">
                          <span className="pie-legend-dot" style={{background: pieColors[i % pieColors.length]}}></span>
                          <span>{k}</span>
                          <span className="pie-legend-value">{fmtShortMoney(v)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {activeLoans.length > 0 && (
              <div className="loan-section">
                <div className="chart-title">贷款进度</div>
                <div className="loan-progress">
                  {activeLoans.map(loan => {
                    const total = Number(loan.fields['总期数']) || 1;
                    const paid = Number(loan.fields['已还期数']) || 0;
                    const remain = Math.max(0, (Number(loan.fields['贷款总额']) || 0) - (Number(loan.fields['已还本金']) || 0));
                    const pct = Math.min(100, Math.round((paid / total) * 100));
                    return (
                      <div key={loan.record_id} className="loan-card">
                        <div className="loan-name">{loan.fields['贷款名称']}</div>
                        <div className="loan-meta">
                          <span>{paid} / {total} 期</span>
                          <span>{pct}%</span>
                        </div>
                        <div className="loan-bar-bg">
                          <div className="loan-bar-fill" style={{width: pct + '%'}}></div>
                        </div>
                        <div className="loan-remain">剩余本金 {fmtMoney(remain)} · 月供 {fmtMoney(loan.fields['月还款额'])}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {upcomingReminders.length > 0 && (
              <div className="reminder-section">
                <div className="chart-title">近期提醒</div>

/* ==========================================================
   模块详情页 ModulePage
   ========================================================== */

function ModulePage({ moduleName, icon, color, modulePath }) {
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [unlocked, setUnlocked] = useState(isUnlocked());
  const [showPwd, setShowPwd] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [formData, setFormData] = useState({});
  const [viewRecord, setViewRecord] = useState(null);
  const [filters, setFilters] = useState({
    status: '', priority: '', search: '', showArchived: false,
  });

  // 模块锁定状态
  const [moduleLocked, setModuleLocked] = useState(false);
  const [moduleUnlocked, setModuleUnlocked] = useState(false);
  const [showLockModal, setShowLockModal] = useState(false);

  const refreshModuleLock = () => {
    if (!modulePath) return;
    const locked = isModuleLocked(modulePath);
    setModuleLocked(locked);
    // 会话态解锁优先
    setModuleUnlocked(locked ? isSessionUnlocked(modulePath) : true);
  };

  useEffect(() => {
    refreshModuleLock();
    const onStorage = () => refreshModuleLock();
    const onLockChange = () => refreshModuleLock();
    window.addEventListener('storage', onStorage);
    window.addEventListener('oc_lock_changed', onLockChange);
    return () => {
      window.removeEventListener('storage', onStorage);
      window.removeEventListener('oc_lock_changed', onLockChange);
    };
  }, [modulePath]);

  const handleModuleUnlock = () => {
    if (modulePath) {
      setSessionUnlocked(modulePath, true);
      setModuleUnlocked(true);
    }
    setShowLockModal(false);
  };

  useEffect(() => {
    loadRecords();
  }, [moduleName]);

  const loadRecords = async () => {
    try {
      setLoading(true);
      const all = await getAllRecords();
      const filtered = all.filter(r => r.fields['所属模块'] === moduleName);
      setRecords(filtered);
      setError('');
    } catch (err) {
      console.error(err);
      setError(err.message || '加载失败');
    } finally {
      setLoading(false);
    }
  };

  const visibleRecords = useMemo(() => {
    let result = [...records];
    if (!unlocked) {
      result = result.filter(r => r.fields['隐私状态'] !== '隐藏' && r.fields['任务状态'] !== '归档');
    }
    if (!filters.showArchived) {
      result = result.filter(r => r.fields['任务状态'] !== '归档');
    }
    if (filters.status) {
      result = result.filter(r => r.fields['任务状态'] === filters.status);
    }
    if (filters.priority) {
      result = result.filter(r => r.fields['优先级'] === filters.priority);
    }
    if (filters.search) {
      const keyword = filters.search.toLowerCase();
      result = result.filter(r =>
        (r.fields['任务标题'] || '').toLowerCase().includes(keyword) ||
        (r.fields['详细内容'] || '').toLowerCase().includes(keyword)
      );
    }
    result.sort((a, b) => {
      const statusOrder = { '进行中': 0, '待执行': 1, '搁置': 2, '已完成': 3, '归档': 4 };
      const sA = statusOrder[a.fields['任务状态']] ?? 5;
      const sB = statusOrder[b.fields['任务状态']] ?? 5;
      if (sA !== sB) return sA - sB;
      const aDate = parseDeadline(a.fields['截止时间'])?.getTime() || 0;
      const bDate = parseDeadline(b.fields['截止时间'])?.getTime() || 0;
      if (aDate && bDate) return aDate - bDate;
      if (aDate) return -1;
      if (bDate) return 1;
      const priOrder = { '高': 0, '中': 1, '低': 2 };
      return (priOrder[a.fields['优先级']] ?? 3) - (priOrder[b.fields['优先级']] ?? 3);
    });
    return result;
  }, [records, filters, unlocked]);

  const stats = useMemo(() => {
    const count = visibleRecords.length;
    const done = visibleRecords.filter(r => r.fields['任务状态'] === '已完成').length;
    const doing = visibleRecords.filter(r => r.fields['任务状态'] === '进行中').length;
    const todo = visibleRecords.filter(r => r.fields['任务状态'] === '待执行').length;
    return { total: count, done, doing, todo };
  }, [visibleRecords]);

  const openAddForm = () => {
    setEditingRecord(null);
    setFormData({
      '所属模块': moduleName,
      '任务标题': '',
      '详细内容': '',
      '任务状态': '待执行',
      '优先级': '中',
      '所属标签': [],
      '进度占比': 0,
      '隐私状态': '公开',
    });
    setShowForm(true);
  };

  const openEditForm = (record) => {
    setEditingRecord(record);
    setFormData({ ...record.fields });
    setShowForm(true);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!formData['任务标题']) return;
    try {
      const versionAction = editingRecord
        ? `修改：${editingRecord.fields['任务标题']} → ${formData['任务标题']}`
        : `新增：${formData['任务标题']}`;
      const oldVersion = editingRecord?.fields['版本变更记录'] || '';
      const fields = {
        ...formData,
        '版本变更记录': makeVersionEntry(versionAction) + oldVersion,
      };
      if (editingRecord) {
        await updateRecord(editingRecord.record_id, fields);
      } else {
        await createRecord(fields);
      }
      setShowForm(false);
      loadRecords();
    } catch (err) {
      alert('保存失败：' + err.message);
    }
  };

  const handleArchive = async (record) => {
    const isArchived = record.fields['任务状态'] === '归档';
    if (!confirm(isArchived ? '确定从归档恢复这条任务吗？' : '确定归档这条任务吗？')) return;
    try {
      if (isArchived) {
        await updateRecord(record.record_id, { '任务状态': '待执行', '隐私状态': '公开' });
      } else {
        await archiveRecord(record.record_id, record.fields);
      }
      loadRecords();
    } catch (err) {
      alert('操作失败：' + err.message);
    }
  };

  const handleDelete = async (record) => {
    if (!confirm('确定彻底删除这条任务吗？删除后无法恢复。')) return;
    try {
      await deleteRecord(record.record_id);
      loadRecords();
    } catch (err) {
      alert('删除失败：' + err.message);
    }
  };

  const handleStatusChange = async (record, newStatus) => {
    try {
      const oldVersion = record.fields['版本变更记录'] || '';
      await updateRecord(record.record_id, {
        '任务状态': newStatus,
        '版本变更记录': makeVersionEntry(`状态变更：${record.fields['任务状态']} → ${newStatus}`) + oldVersion,
      });
      loadRecords();
    } catch (err) {
      alert('更新失败：' + err.message);
    }
  };

  return (
    <div className="module-page">
      <div className="page-header">
        <div className="flex items-center gap-3">
          <span className="page-icon">{icon}</span>
          <div>
            <h1 className="page-title">
              {moduleName}
              {moduleLocked && <span className="page-lock-icon" title="模块已锁定">🔒</span>}
            </h1>
            <div className="page-sub text-secondary">
              {moduleLocked && !moduleUnlocked
                ? '此模块已锁定，请解锁后查看内容'
                : `共 ${stats.total} 项任务 · ${stats.doing} 进行中 · ${stats.todo} 待办 · ${stats.done} 已完成`}
            </div>
          </div>
        </div>
        <div className="page-actions flex gap-2">
          {moduleLocked && !moduleUnlocked && (
            <button className="btn btn-warning" onClick={() => setShowLockModal(true)}>
              🔓 解锁模块
            </button>
          )}
          {(!moduleLocked || moduleUnlocked) && !unlocked && (
            <button className="btn btn-secondary" onClick={() => setShowPwd(true)}>
              🔒 解锁隐私
            </button>
          )}
          {(!moduleLocked || moduleUnlocked) && (
            <button className="btn btn-primary" onClick={openAddForm}>
              + 新建任务
            </button>
          )}
        </div>
      </div>

      {/* 模块锁定 - 大锁界面 */}
      {moduleLocked && !moduleUnlocked && (
        <div className="module-lock-screen">
          <div className="module-lock-content">
            <div
              className="module-lock-big-icon-only"
              onClick={() => setShowLockModal(true)}
              title="点击解锁"
            >
              🔒
            </div>
          </div>
        </div>
      )}

      {/* 模块内容 - 未锁定或已解锁时显示 */}
      {(!moduleLocked || moduleUnlocked) && (
        <>
      {error && (

              <div className="form-row">

                      const date = new Date(e.target.value);

                      } else {

              </div>
              <div className="form-group">
                <label>隐私状态</label>

                  value={formData['隐私状态'] || '公开'}

              <div className="form-group">

              <div className="form-actions">
                <button type="button" className="btn btn-secondary" onClick={() => setShowForm(false)}>
                  取消

              </div>
            </form>
          </div>
        </div>
      )}

      {viewRecord && (
        <div className="modal-overlay" onClick={() => setViewRecord(null)}>
          <div className="modal-content detail-modal" onClick={e => e.stopPropagation()}>
            <div className="detail-header">
              <h2 className="detail-title">{viewRecord.fields['任务标题'] || '未命名'}</h2>
              <button className="close-btn" onClick={() => setViewRecord(null)}>✕</button>
            </div>
            <div className="detail-tags flex gap-2 flex-wrap">
              <span className={`tag ${STATUS_COLORS[viewRecord.fields['任务状态']] || 'tag-gray'}`}>
                {viewRecord.fields['任务状态']}
              </span>
              <span className={`tag ${PRIORITY_COLORS[viewRecord.fields['优先级']] || 'tag-gray'}`}>
                {viewRecord.fields['优先级']}优先级
              </span>
              {viewRecord.fields['截止时间'] && (
                <span className="tag tag-cyan">📅 {formatDate(viewRecord.fields['截止时间'])}</span>
              )}
              {viewRecord.fields['隐私状态'] === '隐藏' && (
                <span className="tag tag-purple">🔒 隐藏</span>
              )}
            </div>
            {viewRecord.fields['详细内容'] && (
              <div className="detail-section">
                <h4 className="detail-section-title">详细内容</h4>
                <div className="detail-content text-secondary">
                  {viewRecord.fields['详细内容'].split('\n').map((line, i) => (
                    <div key={i}>{line || '　'}</div>
                  ))}
                </div>
              </div>
            )}
            {viewRecord.fields['所属标签']?.length > 0 && (
              <div className="detail-section">
                <h4 className="detail-section-title">标签</h4>
                <div className="flex gap-2 flex-wrap">
                  {viewRecord.fields['所属标签'].map((t, i) => (
                    <span key={i} className="tag tag-blue">{t}</span>
                  ))}
                </div>
              </div>
            )}
            {viewRecord.fields['版本变更记录'] && (
              <div className="detail-section">
                <h4 className="detail-section-title">版本记录</h4>
                <div className="version-list">
                  {parseVersionHistory(viewRecord.fields['版本变更记录']).map((v, i) => (
                    <div key={i} className="version-item">
                      <span className="version-time text-xs text-muted">{v.time}</span>
                      <span className="version-action text-sm">{v.action}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="detail-footer">
              <button
                className="btn btn-danger-ghost"
                onClick={() => {
                  if (confirm('确定彻底删除这条任务吗？删除后无法恢复。')) {
                    deleteRecord(viewRecord.record_id).then(() => {
                      setViewRecord(null);
                      loadRecords();
                    }).catch(e => alert('删除失败：' + e.message));
                  }
                }}
              >
                🗑 删除
              </button>
              <button className="btn btn-secondary" onClick={() => setViewRecord(null)}>关闭</button>
              <button
                className="btn btn-primary"
                onClick={() => {
                  setViewRecord(null);
                  openEditForm(viewRecord);
                }}
              >
                编辑
              </button>
            </div>
          </div>
        </div>
      )}
        </>
      )}

      {showLockModal && (
        <ModuleUnlockModal
          title={`解锁「${moduleName}」`}
          onSuccess={handleModuleUnlock}
          onClose={() => setShowLockModal(false)}
        />
      )}
    </div>
  );
}

/* ==========================================================
   页面：模块管理 ModuleManagePage
   ========================================================== */

const COLOR_OPTIONS = ['blue', 'purple', 'pink', 'cyan', 'green', 'yellow', 'orange', 'red'];
const ICON_OPTIONS = ['📚', '✨', '🌏', '🎬', '🎓', '💰', '💡', '📝', '🎯', '🚀', '🌟', '📊', '🎨', '🎵', '🏃', '💪', '🧠', '❤️', '🌱', '🏠'];

// 模块名到路径标识的常用映射（没有匹配的就用 module-数字）
const NAME_PATH_MAP = {
  '通知信息消化中心': 'notification',
  '教学管理': 'teaching',
  '自媒体运营': 'media',
  '国际中文教学': 'chinese',
  '动画项目矩阵': 'animation',
  '同等学力申硕': 'degree',
  '个人财务&生活': 'finance',
  '个人财务': 'finance',
  '生活管理': 'life',
  '想法沉淀与目标对齐': 'ideas',
  '想法沉淀': 'ideas',
  '目标对齐': 'goals',
  '读书学习': 'reading',
  '健康管理': 'health',
  '旅行记录': 'travel',
  '项目管理': 'projects',
  '效率工具': 'tools',
  '写作创作': 'writing',
  '副业体系': 'sidebiz',
  '专业能力': 'career',
};

function generatePathKey(name) {
  if (!name) return '';
  if (NAME_PATH_MAP[name]) return NAME_PATH_MAP[name];
  // 没有映射的话，用简单的字符替换
  return name
    .replace(/[&\s]/g, '-')
    .replace(/[^a-zA-Z0-9-]/g, '')
    .toLowerCase() || 'new-module';
}

function ModuleManagePage({ modules, onModulesChange }) {
  const [showForm, setShowForm] = useState(false);
  const [editingModule, setEditingModule] = useState(null);
  const [formData, setFormData] = useState({});
  const [saving, setSaving] = useState(false);
  const [lockedMap, setLockedMap] = useState({});
  const [showUnlockModal, setShowUnlockModal] = useState(false);
  const [showChangePwdModal, setShowChangePwdModal] = useState(false);
  const [unlockTarget, setUnlockTarget] = useState(null);

  // 刷新锁定状态
  const refreshLocked = () => {
    const map = {};
    getLockedModules().forEach(p => { map[p] = true; });
    setLockedMap(map);
  };

  useEffect(() => {
    refreshLocked();
    const onStorage = () => refreshLocked();
    const onLockChange = () => refreshLocked();
    window.addEventListener('storage', onStorage);
    window.addEventListener('oc_lock_changed', onLockChange);
    return () => {
      window.removeEventListener('storage', onStorage);
      window.removeEventListener('oc_lock_changed', onLockChange);
    };
  }, []);

  const handleLock = (mod) => {
    lockModule(mod.path);
    refreshLocked();
  };

  const openUnlockModal = (mod) => {
    setUnlockTarget(mod);
    setShowUnlockModal(true);
  };

  const handleUnlockSuccess = () => {
    if (unlockTarget) {
      unlockModule(unlockTarget.path);
      setSessionUnlocked(unlockTarget.path, false);
      refreshLocked();
    }
    setShowUnlockModal(false);
    setUnlockTarget(null);
  };

  const openAddForm = () => {
    setEditingModule(null);
    setFormData({
      '模块名称': '',
      '图标': '📁',
      '主题色': 'blue',
      '路径标识': '',
      '排序': modules.length + 1,
      '描述': '',
    });
    setShowForm(true);
  };

  // 模块名称变化时自动生成路径标识
  const handleNameChange = (name) => {
    const newData = { ...formData, '模块名称': name };
    // 只有新建时才自动生成，编辑时保留原值
    if (!editingModule) {
      newData['路径标识'] = generatePathKey(name);
    }
    setFormData(newData);
  };

  const openEditForm = (mod) => {
    setEditingModule(mod);
    setFormData({
      '模块名称': mod.key,
      '图标': mod.icon,
      '主题色': mod.color,
      '路径标识': mod.pathKey,
      '排序': mod.sort,
      '描述': mod.description,
    });
    setShowForm(true);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!formData['模块名称']) {
      alert('请填写模块名称');
      return;
    }
    // 新建时校验路径标识（自动生成，一般不会空）
    if (!editingModule && !formData['路径标识']) {
      alert('路径标识生成失败，请重试');
      return;
    }
    try {
      setSaving(true);
      if (editingModule) {
        await updateModule(editingModule.record_id, formData);
      } else {
        await createModule(formData);
      }
      setShowForm(false);
      onModulesChange();
    } catch (err) {
      alert('保存失败：' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDelete = async (mod) => {
    if (!confirm(`确定删除模块「${mod.key}」吗？\n\n注意：只会删除模块定义，该模块下的任务数据仍然保留在数据表中。`)) return;
    try {
      await deleteModule(mod.record_id);
      onModulesChange();
    } catch (err) {
      alert('删除失败：' + err.message);
    }
  };

  return (
    <div className="module-manage-page">
      <div className="page-header">
        <div>
          <h1 className="page-title">⚙️ 模块管理</h1>
          <p className="page-subtitle">管理业务模块的名称、图标、颜色和排序</p>
        </div>
        <button className="btn btn-primary" onClick={openAddForm}>
          + 新建模块
        </button>
      </div>

      <div className="module-grid">
        {modules.map(mod => {
          const isLocked = !!lockedMap[mod.path];
          return (
          <div key={mod.record_id || mod.key} className={`module-card card theme-${mod.color} ${isLocked ? 'module-card-locked' : ''}`}>
            <div className="module-card-header">
              <span className="module-icon">{mod.icon}</span>
              <h3 className="module-name">
                {mod.key}
                {isLocked && (
                  <span
                    className="module-lock-icon clickable"
                    title="点击解锁"
                    onClick={(e) => { e.stopPropagation(); openUnlockModal(mod); }}
                  >🔒</span>
                )}
              </h3>
            </div>
            {mod.description && (
              <p className="module-desc text-secondary text-sm">{mod.description}</p>
            )}
            <div className="module-meta text-xs text-muted">
              路径: /{mod.pathKey} · 排序: {mod.sort}
            </div>
            <div className="module-actions">
              <button className="btn btn-secondary btn-sm" onClick={() => openEditForm(mod)}>✏️ 编辑</button>
              <button className="btn btn-danger-ghost btn-sm" onClick={() => handleDelete(mod)}>🗑 删除</button>
              {isLocked ? (
                <button className="btn btn-warning btn-sm" onClick={() => openUnlockModal(mod)}>🔓 解锁</button>
              ) : (
                <button className="btn btn-secondary btn-sm" onClick={() => handleLock(mod)}>🔒 锁定</button>
              )}
            </div>
          </div>
        );})}
      </div>

      {showForm && (
        <div className="modal-overlay" onClick={() => setShowForm(false)}>
          <div className="modal-content form-modal" onClick={e => e.stopPropagation()}>
            <h2 className="form-title">{editingModule ? '编辑模块' : '新建模块'}</h2>
            <form onSubmit={handleSubmit}>
              <div className="form-row">
                <div className="form-group">
                  <label>模块名称 *</label>
                  <input
                    type="text"
                    value={formData['模块名称'] || ''}
                    onChange={e => handleNameChange(e.target.value)}
                    placeholder="如：教学管理"
                    required
                  />
                </div>
                <div className="form-group">
                  <label>路径标识（自动生成）</label>
                  <input
                    type="text"
                    value={formData['路径标识'] || ''}
                    onChange={e => setFormData({ ...formData, '路径标识': e.target.value.replace(/[^a-zA-Z0-9-]/g, '') })}
                    placeholder="英文小写，如 teaching"
                    readOnly
                    className="input-readonly"
                    required
                  />
                  <div className="form-hint text-xs text-muted">
                    {editingModule ? '创建后不可修改，用于网址定位' : '根据模块名称自动生成，创建后不可修改'}
                  </div>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label>图标</label>
                  <div className="icon-picker">
                    {ICON_OPTIONS.map(ic => (
                      <button
                        key={ic}
                        type="button"
                        className={`icon-option ${formData['图标'] === ic ? 'active' : ''}`}
                        onClick={() => setFormData({ ...formData, '图标': ic })}
                      >
                        {ic}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="form-group">
                  <label>主题色</label>
                  <div className="color-picker">
                    {COLOR_OPTIONS.map(c => (
                      <button
                        key={c}
                        type="button"
                        className={`color-option color-${c} ${formData['主题色'] === c ? 'active' : ''}`}
                        onClick={() => setFormData({ ...formData, '主题色': c })}
                      />
                    ))}
                  </div>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label>排序</label>
                  <input
                    type="number"
                    min="1"
                    value={formData['排序'] || 1}
                    onChange={e => setFormData({ ...formData, '排序': Number(e.target.value) })}
                  />
                </div>
              </div>
              <div className="form-group">
                <label>描述</label>
                <textarea
                  value={formData['描述'] || ''}

// 通用：按条件搜索记录（全量拉取后 JS 过滤，保持与现有模式一致）
async function fetchTeachingTable(tableKey) {
  const { appToken, tables } = TEACHING_CONFIG;
  const tableId = tables[tableKey];
  if (!tableId) return [];
  const allItems = [];
  let pageToken = '';
  let hasMore = true;
  while (hasMore) {
    const url = `/bitable/v1/apps/${appToken}/tables/${tableId}/records/search`;
    const body = { page_size: 500 };
    if (pageToken) body.page_token = pageToken;
    const data = await feishuRequest(url, { method: 'POST', body: JSON.stringify(body) });
    allItems.push(...(data.items || []));
    hasMore = data.has_more;
    pageToken = data.page_token || '';
  }
  return allItems.map(item => ({ ...item, fields: cleanFields(item.fields) }));
}

// 工具：从关联字段（record_id 数组）映射名称
function mapRelationNames(recordIds, allRecords, nameField = '名称') {
  if (!recordIds || !Array.isArray(recordIds) || recordIds.length === 0) return [];
  const map = {};
  allRecords.forEach(r => { map[r.record_id] = getFieldValue(r.fields[nameField]) || r.record_id; });
  return recordIds.map(id => map[id] || id).filter(Boolean);
}

function getFirstRelationName(recordIds, allRecords, nameField = '名称') {
  const names = mapRelationNames(recordIds, allRecords, nameField);
  return names.length > 0 ? names[0] : '';
}

// 获取本周的起止时间
function getWeekRange(date = new Date()) {
  const d = new Date(date);
  const day = d.getDay() || 7; // 周日=7
  const start = new Date(d);
  start.setDate(d.getDate() - day + 1);
  start.setHours(0, 0, 0, 0);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  end.setHours(23, 59, 59, 999);
  return { start, end };
}

// 计算当前学期进度（第几周/总周数）
function calcSemesterProgress(semester) {
  if (!semester) return { currentWeek: 0, totalWeeks: 0, percent: 0 };
  const f = semester.fields;
  const startDate = f['开始日期'] ? new Date(f['开始日期']) : null;
  const endDate = f['结束日期'] ? new Date(f['结束日期']) : null;
  const totalWeeks = Number(f['总周数']) || 0;
  
  if (!startDate || !endDate) {
    return { currentWeek: 0, totalWeeks, percent: 0 };
  }
  
  const now = new Date();
  if (now < startDate) {
    return { currentWeek: 0, totalWeeks, percent: 0 };
  }
  if (now > endDate) {
    return { currentWeek: totalWeeks, totalWeeks, percent: 100 };
  }
  
  const diffMs = now - startDate;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  const currentWeek = Math.min(totalWeeks, Math.floor(diffDays / 7) + 1);
  const percent = totalWeeks > 0 ? Math.round((currentWeek / totalWeeks) * 100) : 0;
  
  return { currentWeek, totalWeeks, percent };
}


// 工作名称字段三级 fallback：工作名称 / 工作标题 / 标题
function getWorkName(fields) {
  return fields['工作名称'] || fields['工作标题'] || fields['标题'] || '未命名';
}

// 计算学期教学检查周期（期初/期中/期末）
function getSemesterCheckCycles(semester) {
  if (!semester) return [];
  const f = semester.fields;
  const totalWeeks = Number(f['总周数']) || 18;
  const startDate = f['开始日期'] ? new Date(f['开始日期']) : new Date();
  
  const addWeeks = (date, weeks) => {
    const d = new Date(date);
    d.setDate(d.getDate() + weeks * 7);
    return d;
  };
  
  return [
    {
      name: '期初教学检查',
      startWeek: 1,
      endWeek: 3,
      startDate: startDate,
      endDate: addWeeks(startDate, 3),
      color: '#f59e0b',
      icon: '📋',
      desc: '开学初教学秩序与准备工作检查'
    },
    {
      name: '期中教学检查',
      startWeek: 8,
      endWeek: 10,
      startDate: addWeeks(startDate, 7),
      endDate: addWeeks(startDate, 10),
      color: '#3b82f6',
      icon: '🔍',
      desc: '中期教学质量与进度检查'
    },
    {
      name: '期末教学检查',
      startWeek: 15,
      endWeek: 18,
      startDate: addWeeks(startDate, 14),
      endDate: addWeeks(startDate, 18),
      color: '#ef4444',
      icon: '📝',
      desc: '期末考核与教学总结检查'
    }
  ];
}

function getCurrentCheckCycle(semester) {
  const cycles = getSemesterCheckCycles(semester);
  const progress = calcSemesterProgress(semester);
  const week = progress.currentWeek;
  return cycles.find(c => week >= c.startWeek && week <= c.endWeek) || null;
}

function TeachingOverview({ semester, semesterData, allData }) {
  const { courses, teachers, classes, archives, works } = semesterData;
  const { classrooms } = allData;

  const progress = React.useMemo(() => calcSemesterProgress(semester), [semester]);

  // 本周工作
  const weekWorks = React.useMemo(() => {
    const { start, end } = getWeekRange();
    return works
      .filter(w => {
        const due = w.fields['截止日期'];
        if (!due) return false;
        const d = new Date(due);
        return d >= start && d <= end;
      })
      .sort((a, b) => (a.fields['截止日期'] || 0) - (b.fields['截止日期'] || 0))
      .slice(0, 5);
  }, [works]);

  // 重点工作（高优先级且未完成）
  const keyWorks = React.useMemo(() => {
    return works
      .filter(w => {
        const priority = w.fields['优先级'];
        const status = w.fields['状态'];
        return priority === '高' && status !== '已完成';
      })
      .sort((a, b) => (a.fields['截止日期'] || 0) - (b.fields['截止日期'] || 0))
      .slice(0, 5);
  }, [works]);

  // 常规工作进度（从课程档案统计）
  const routineProgress = React.useMemo(() => {
    const total = archives.length || 1;
    const calcDone = (fieldName, doneVal = '已完成') => {
      const done = archives.filter(a => a.fields[fieldName] === doneVal).length;
      return Math.round((done / total) * 100);
    };
    return {
      outline: calcDone('大纲状态', '已完成'),
      lessonPlan: calcDone('教案状态', '已完成'),
      observation: calcDone('听课状态', '已完成'),
      homework: calcDone('作业批改状态', '已完成'),
    };
  }, [archives]);

  const quickActions = [
    { icon: '📝', label: '新增工作' },
    { icon: '📋', label: '会议记录' },
    { icon: '👂', label: '听课记录' },
    { icon: '📚', label: '资源库' },
    { icon: '➕', label: '新增课程' },
    { icon: '📦', label: '档案归档' },
  ];

  const handleQuickAction = (label) => {
    alert(`${label} - 功能开发中...`);
  };

  return (
    <div className="teaching-overview">

        </div>

          <div className="teaching-stat-value">{classes.length}</div>
          <div className="teaching-stat-sub">教学班数量</div>
        </div>
        <div className="teaching-stat-card stat-classrooms">
          <div className="teaching-stat-label">教室数</div>
          <div className="teaching-stat-value">{classrooms.length}</div>
          <div className="teaching-stat-sub">可用教室总数</div>
        </div>
      </div>

      {/* 学期进度 */}
      <div className="teaching-card">
        <div className="teaching-card-title">
          <span>📅</span> 本学期进度
        </div>
        <div className="teaching-semester-progress">

            <span>第 {progress.currentWeek} 周 / 共 {progress.totalWeeks} 周</span>

          </div>
          <div className="teaching-progress-bar">
